<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RankFeed · Print</title>
<style>
  /* PRINT_MM: size of the square on paper */
  :root { --print-mm: 120mm; --ink: #222; --grey: #757575; --red: #ee3322; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  .sheet { width: 100%; aspect-ratio: 1; border: 1px solid #e8e8e8; }
  .sheet svg { display: block; }
  .note { font-size: 15px; line-height: 1.45; color: var(--grey); margin: 14px 0; min-height: 1.45em; }
  .row { display: flex; gap: 10px; }
  button { font: inherit; font-size: 17px; font-weight: 700; padding: 14px 18px; border: 0; border-radius: 4px; cursor: pointer; }
  #print { flex: 1; background: var(--red); color: #fff; }
  #print:disabled { opacity: .4; }
  #back { background: #f0f0f0; color: var(--ink); }

  @page { margin: 10mm; }
  @media print {
    main { padding: 0; max-width: none; }
    .sheet { width: var(--print-mm); border: 0; }
    .note, .row { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="sheet" id="sheet"></div>
  <p class="note" id="note">Loading the path of this entry…</p>
  <div class="row">
    <button id="back" type="button">Back</button>
    <button id="print" type="button" disabled>Print</button>
  </div>
</main>
<script src="shared.js"></script>
<script src="print.js"></script>
<script>
// print.html?list=students&image=/images/students/x.jpg&title=…&auto=1
const qs = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);

$("back").onclick = () => (history.length > 1 ? history.back() : window.close());
$("print").onclick = () => window.print();

(async function start() {
  try {
    const r = await fetch(RANK_BASE + "/api/track?" + new URLSearchParams({ list: qs.get("list") || "", image: qs.get("image") || "" }),
                          { cache: "no-store" });
    if (r.status === 404) {
      $("note").textContent = `${qs.get("title") || "This entry"} is not in the running round anymore. Its path is gone.`;
      return;
    }
    if (!r.ok) throw new Error();
    const data = await r.json();
    $("sheet").innerHTML = drawRankPrint(data);
    $("note").textContent = `${data.entry.title}, its path through this round, as of ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.`;
    $("print").disabled = false;
    if (qs.get("auto")) setTimeout(() => window.print(), 300);
  } catch {
    $("note").textContent = "The ranking machine can't be reached right now. Try again in a moment.";
  }
})();
</script>
</body>
</html>
