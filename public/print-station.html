<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rankmania · Print station</title>
<!--
  The print station: keep this page open on a computer next to the printer.
  It collects the stickers from RankFeed and prints a sheet as soon as it is full
  (label paper with 12 round stickers of 60 mm on A4). "Print part sheet now" prints what is there.

  To print without a dialog, start Chrome with --kiosk-printing; it then prints straight to the
  default printer of the computer (set the Brother as the default printer first). On a Mac:
    open -na "Google Chrome" --args --kiosk-printing --user-data-dir="$HOME/rankmania-print" https://<your-app>.onrender.com/print-station.html
-->
<style>
  :root { --ink: #222; --grey: #757575; --red: #ee3322; --green: #1a9e3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, button { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 4px; }
  input { border: 1px solid #ccc; flex: 1; min-width: 160px; }
  button { border: 0; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
  button.light { background: #eee; color: var(--ink); }
  #state { font-size: 15px; margin: 16px 0; padding: 10px 12px; background: #f6f6f6; border-left: 6px solid var(--grey); }
  #state.on { border-color: var(--green); }
  #state.off { border-color: var(--red); }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; color: var(--grey); flex: 1; min-width: 220px; }
  ol b { color: var(--ink); font-weight: 600; }

  /* the label sheet: A4 with 12 round stickers (positions in the script: SHEET) */
  .page { position: relative; width: 210mm; height: 297mm; background: #fff; }
  .page .st { position: absolute; width: 60mm; height: 60mm; }
  .page .st svg { display: block; }
  .page .slot { position: absolute; width: 60mm; height: 60mm; border-radius: 50%; border: 1px dashed #ccc; }
  .preview { zoom: .36; box-shadow: 0 0 0 3px #ddd; flex: none; }

  @page { size: A4; margin: 0; }
  @media print {
    main > :not(.wrap), ol, .page .slot { display: none !important; }
    main { padding: 0; max-width: none; }
    .preview { zoom: 1; box-shadow: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Print station</h1>
  <div class="row">
    <input id="key" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="go" type="button">Start</button>
    <button id="flush" type="button" class="light">Print part sheet now</button>
  </div>
  <div id="state">Enter the admin password and press Start.</div>
  <div class="wrap">
    <div class="page preview" id="page"></div>
    <ol id="log" reversed></ol>
  </div>
</main>
<script src="shared.js"></script>
<script src="print.js"></script>
<script>
// The label paper: the middle of each sticker in mm from the top left corner of the A4 sheet.
// Measure your paper and change these if the stickers don't sit on the labels.
const D = 60; // sticker diameter in mm (also .page .st / .slot in the style)
const SHEET = [
  [40, 49.5], [105, 49.5], [170, 49.5],
  [40, 115.5], [105, 115.5], [170, 115.5],
  [40, 181.5], [105, 181.5], [170, 181.5],
  [40, 247.5], [105, 247.5], [170, 247.5],
];
const PER_SHEET = SHEET.length;
const POLL_MS = 3000; // how often it asks for new stickers
const AFTER_PRINT_MS = 8000; // pause after each sheet, so the printer can keep up
const $ = (id) => document.getElementById(id);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
let key = "";
let running = false;
let flushNext = false;

try { $("key").value = localStorage.getItem("rankmania-print-key") || ""; } catch {}

function state(text, cls) {
  $("state").textContent = text;
  $("state").className = cls || "";
}
function log(html) {
  const li = document.createElement("li");
  li.innerHTML = html;
  $("log").prepend(li);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const at = ([x, y]) => `left:${x - D / 2}mm;top:${y - D / 2}mm`;

// the sheet: stickers on the first places, the empty places only as dashed circles on the screen
function drawPage(jobs) {
  $("page").innerHTML = SHEET.map((p, i) => jobs[i]
    ? `<div class="st" style="${at(p)}">${drawRankPrint(jobs[i].data, "-" + i)}</div>`
    : `<div class="slot" style="${at(p)}"></div>`).join("");
}
drawPage([]);

// print the sheet and wait until the browser is done with it
function printSheet(jobs) {
  drawPage(jobs);
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    window.addEventListener("afterprint", finish, { once: true });
    setTimeout(() => { window.print(); setTimeout(finish, 1500); }, 200); // let the drawing appear first
  });
}

async function loop() {
  while (running) {
    try {
      const flush = flushNext;
      flushNext = false;
      const r = await fetch(RANK_BASE + "/api/print/next", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, count: PER_SHEET, flush }), cache: "no-store",
      });
      if (r.status === 403) {
        running = false;
        state("Wrong password. Enter the admin password and press Start again.", "off");
        return;
      }
      const m = await r.json();
      const jobs = m.jobs || [];
      if (jobs.length) {
        state(`Printing a sheet with ${jobs.length} sticker${jobs.length > 1 ? "s" : ""}…`, "on");
        await printSheet(jobs);
        log(`Sheet printed ${time(Date.now())}: ` + jobs.map((j) => {
          const c = j.data.current;
          return `<b>${esc(j.data.entry.title)}</b>${c ? ` #${c.rank} ${c.tier}` : ""}`;
        }).join(", "));
        state(`Running. ${m.waiting} sticker${m.waiting === 1 ? "" : "s"} waiting for the next sheet.`, "on");
        await wait(AFTER_PRINT_MS);
        continue;
      }
      if (flush) state("Nothing to print.", "on");
      else state(`Running. ${m.waiting} of ${PER_SHEET} stickers for the next sheet… (last check ${time(Date.now())})`, "on");
    } catch {
      state(`The ranking machine can't be reached. Trying again… (${time(Date.now())})`, "off");
    }
    await wait(POLL_MS);
  }
}

$("go").onclick = () => {
  key = $("key").value.trim();
  if (!key) return state("Enter the admin password first.", "off");
  try { localStorage.setItem("rankmania-print-key", key); } catch {}
  if (running) return;
  running = true;
  state("Running. Waiting for stickers…", "on");
  loop();
};
$("flush").onclick = () => {
  if (!running) return state("Press Start first.", "off");
  flushNext = true;
  state("Printing what is there with the next check…", "on");
};
// started before with a saved password: start again by itself after a reload
if ($("key").value) $("go").click();
</script>
</body>
</html>
