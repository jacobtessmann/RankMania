<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rankmania · Print station</title>
<!--
  The print station: keep this page open on a computer next to the printer.
  It collects the stickers from RankFeed and prints a sheet as soon as it is full
  (label paper with 12 round stickers of 60 mm on A4). "Print part sheet now" prints what is there.

  To print without a dialog, start Chrome with --kiosk-printing; it then prints straight to the
  default printer of the computer (set the Brother as the default printer first). On a Mac:
    open -na "Google Chrome" --args --kiosk-printing --user-data-dir="$HOME/rankmania-print" https://<your-app>.onrender.com/print-station.html
-->
<style>
  :root { --ink: #222; --grey: #757575; --red: #ee3322; --green: #1a9e3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: Helvetica, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, button { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 4px; }
  input { border: 1px solid #ccc; flex: 1; min-width: 160px; }
  button { border: 0; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
  button.light { background: #eee; color: var(--ink); }
  #state { font-size: 15px; margin: 16px 0; padding: 10px 12px; background: #f6f6f6; border-left: 6px solid var(--grey); }
  #state.on { border-color: var(--green); }
  #state.off { border-color: var(--red); }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.6; color: var(--grey); flex: 1; min-width: 220px; }
  ol b { color: var(--ink); font-weight: 600; }

  /* the label sheet: one SVG of exactly A4, in the coordinates of HERMA's template (script: SHEET) */
  .page { flex: none; line-height: 0; }
  .page > svg { display: block; width: 76mm; height: auto; box-shadow: 0 0 0 3px #ddd; background: #fff; }

  @page { size: 210mm 297mm; margin: 0; }
  @media print {
    html, body { margin: 0; padding: 0; }
    main > :not(.wrap), ol, .slot { display: none !important; }
    main { padding: 0; max-width: none; }
    .wrap { display: block; }
    .page > svg { width: 210mm; height: 297mm; box-shadow: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Print station</h1>
  <div class="row">
    <input id="key" type="password" placeholder="Admin password" autocomplete="current-password">
    <button id="go" type="button">Start</button>
    <button id="flush" type="button" class="light">Print part sheet now</button>
  </div>
  <div id="state">Enter the admin password and press Start.</div>
  <div class="wrap">
    <div class="page preview" id="page"></div>
    <ol id="log" reversed></ol>
  </div>
</main>
<script src="shared.js"></script>
<script src="print.js"></script>
<script>
// The label paper HERMA 4477 (round, 60 mm, 12 per A4), straight from HERMA's template
// (Etiketten-Vorlage-HERMA-round-60-blanko.ai): the sheet is drawn in the template's own units,
// points (1/72 inch) on A4 = 595.2756 × 841.8898, measured from the top left corner.
// Each label is the box between the template's guide lines.
const PAGE_W = 595.2756, PAGE_H = 841.8898;
const COLS = [[22.6772, 192.7559], [212.5985, 382.6772], [402.5198, 572.5984]]; // left, right
const ROWS = [[791.0646, 620.5891], [600.7465, 430.6678], [410.8252, 240.7465], [220.9039, 50.8252]]; // top, bottom (from the bottom, as in the template)
const D = 170.0787; // label diameter in points (60 mm)
const SHEET = ROWS.flatMap(([t, b]) => COLS.map(([l, r]) => [(l + r) / 2, PAGE_H - (t + b) / 2])); // middles, from the top left
const MM = 72 / 25.4; // points per mm
const PER_SHEET = SHEET.length;
const POLL_MS = 3000; // how often it asks for new stickers
const AFTER_PRINT_MS = 8000; // pause after each sheet, so the printer can keep up
const $ = (id) => document.getElementById(id);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
let key = "";
let running = false;
let flushNext = false;

try { $("key").value = localStorage.getItem("rankmania-print-key") || ""; } catch {}

function state(text, cls) {
  $("state").textContent = text;
  $("state").className = cls || "";
}
function log(html) {
  const li = document.createElement("li");
  li.innerHTML = html;
  $("log").prepend(li);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// one sticker placed on the sheet: its SVG nested at the label's place and size
const place = (svg, [x, y]) =>
  svg.replace('width="100%" height="100%"', `x="${x - D / 2}" y="${y - D / 2}" width="${D}" height="${D}"`);

// test marks: a cross on the middle of every label and a 100 mm ruler, to check the print against the labels
function marks() {
  const c = 4 * MM;
  const crosses = SHEET.map(([x, y]) =>
    `<path d="M${x - c},${y}H${x + c}M${x},${y - c}V${y + c}" stroke="#000" stroke-width=".4"/>`).join("");
  const y = PAGE_H - 9 * MM, x0 = PAGE_W / 2 - 50 * MM;
  const ticks = Array.from({ length: 11 }, (_, i) => `M${x0 + i * 10 * MM},${y}v${i % 5 ? -2 * MM : -4 * MM}`).join("");
  return crosses + `<path d="M${x0},${y}h${100 * MM}${ticks}" stroke="#000" stroke-width=".5" fill="none"/>` +
    `<text x="${PAGE_W / 2}" y="${y + 4 * MM}" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">100 mm</text>`;
}

// the sheet: stickers on the first places, the empty places only as dashed circles on the screen
function drawPage(jobs, test = false) {
  $("page").innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PAGE_W} ${PAGE_H}" width="210mm" height="297mm">
    <rect width="${PAGE_W}" height="${PAGE_H}" fill="#fff"/>
    ${SHEET.map((p, i) => jobs[i] ? place(drawRankPrint(jobs[i].data, "-" + i), p)
      : `<circle class="slot" cx="${p[0]}" cy="${p[1]}" r="${D / 2}" fill="none" stroke="#bbb" stroke-dasharray="4 4"/>`).join("")}
    ${test ? marks() : ""}
  </svg>`;
}
drawPage([]);

// print the sheet and wait until the browser is done with it
function printSheet(jobs, test = false) {
  drawPage(jobs, test);
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    window.addEventListener("afterprint", finish, { once: true });
    setTimeout(() => { window.print(); setTimeout(finish, 1500); }, 200); // let the drawing appear first
  });
}

async function loop() {
  while (running) {
    try {
      const flush = flushNext;
      flushNext = false;
      const r = await fetch(RANK_BASE + "/api/print/next", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, count: PER_SHEET, flush }), cache: "no-store",
      });
      if (r.status === 403) {
        running = false;
        state("Wrong password. Enter the admin password and press Start again.", "off");
        return;
      }
      const m = await r.json();
      const jobs = m.jobs || [];
      if (jobs.length) {
        state(`Printing a sheet with ${jobs.length} sticker${jobs.length > 1 ? "s" : ""}…`, "on");
        await printSheet(jobs);
        log(`Sheet printed ${time(Date.now())}: ` + jobs.map((j) => {
          const c = j.data.current;
          return `<b>${esc(j.data.entry.title)}</b>${c ? ` #${c.rank} ${c.tier}` : ""}`;
        }).join(", "));
        state(`Running. ${m.waiting} sticker${m.waiting === 1 ? "" : "s"} waiting for the next sheet.`, "on");
        await wait(AFTER_PRINT_MS);
        continue;
      }
      if (flush) state("Nothing to print.", "on");
      else state(`Running. ${m.waiting} of ${PER_SHEET} stickers for the next sheet… (last check ${time(Date.now())})`, "on");
    } catch {
      state(`The ranking machine can't be reached. Trying again… (${time(Date.now())})`, "off");
    }
    await wait(POLL_MS);
  }
}

$("go").onclick = () => {
  key = $("key").value.trim();
  if (!key) return state("Enter the admin password first.", "off");
  try { localStorage.setItem("rankmania-print-key", key); } catch {}
  if (running) return;
  running = true;
  state("Running. Waiting for stickers…", "on");
  loop();
};
$("flush").onclick = () => {
  if (!running) return state("Press Start first.", "off");
  flushNext = true;
  state("Printing what is there with the next check…", "on");
};
// print-station.html?test=1 prints one test sheet first: 12 stickers of entries ranked right now,
// with a cross on the middle of every label and a 100 mm ruler (nothing is taken from the queue)
async function testSheet() {
  history.replaceState(null, "", location.pathname); // a reload does not print it again
  state("Printing a test sheet…", "on");
  const snap = await (await fetch(RANK_BASE + "/api/state", { cache: "no-store" })).json();
  const picks = snap.categories.flatMap((c) => c.entries.map((e) => [c.name, e.image])).slice(0, PER_SHEET);
  const jobs = [];
  for (const [list, image] of picks) {
    const r = await fetch(RANK_BASE + "/api/track?" + new URLSearchParams({ list, image }), { cache: "no-store" });
    if (r.ok) jobs.push({ at: Date.now(), data: await r.json() });
  }
  await printSheet(jobs, true);
  log(`Test sheet printed ${time(Date.now())} (${jobs.length} stickers, with marks)`);
  state("Test sheet printed. Lay it on a label sheet against the light to check the places.", "on");
}

(async function () {
  if (new URLSearchParams(location.search).has("test")) {
    try { await testSheet(); } catch { state("The test sheet could not be made: the ranking machine can't be reached.", "off"); }
  }
  // started before with a saved password: start again by itself after a reload
  if ($("key").value) $("go").click();
})();
</script>
</body>
</html>
