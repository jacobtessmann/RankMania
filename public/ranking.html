<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Tierlist Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
/*
  TierMaker look: title bar — tier rows S–F — source line — "…" row with the entries not ranked yet
  Works in landscape and portrait. All cards sit absolutely in #cards and are placed by layout().
  The ranking comes ONLY from the server; this page just shows it.
*/
:root {
  --ink: #000; --paper: #fff; --grey: #d9d9d9; --blue: #1010ff;
  --tier-S: #ff7f7f; --tier-A: #ffff7f; --tier-B: #7fff7f;
  --tier-C: #7fffff; --tier-D: #ff7fff; --tier-F: #9b30ff;
  --f-type: "Courier Prime", "Courier New", monospace;
  --f-name: Anton, Impact, "Arial Narrow Bold", sans-serif;
  --label-w: min(14vh, 16vw);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--paper); }
#app {
  width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}

/* ═══ Title ═══ */
#title {
  flex: 0 0 auto; background: var(--grey); color: var(--ink); text-align: center;
  font-family: var(--f-type); font-size: min(7vh, 5.4vw); line-height: 1.15; letter-spacing: .02em;
  text-transform: uppercase; padding: .2em .4em .15em; white-space: nowrap; overflow: hidden;
}
#title .n { color: var(--blue); }

/* ═══ Tier rows ═══ */
#tierlist { flex: 6 1 0; display: flex; flex-direction: column; gap: 2px; min-height: 0; padding-top: 2px; }
.row { flex: 1 1 0; display: flex; min-height: 0; }
.label {
  flex: 0 0 var(--label-w); display: flex; align-items: center; justify-content: center;
  background: var(--c); color: var(--ink); font-family: var(--f-type); font-size: min(6vh, 6vw);
}
.items { flex: 1; min-width: 0; }

#source {
  flex: 0 0 auto; text-align: center; font-family: var(--f-type); font-size: min(2vh, 2.2vw);
  padding: .6em 1em; color: var(--paper);
}
#pool-row { flex: 1 1 0; display: flex; min-height: 0; margin-top: 2px; }
#pool-row .label { background: var(--grey); }

/* ═══ Cards ═══ */
#cards { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.card {
  position: absolute; top: 0; left: 0; will-change: transform;
  transition: transform .9s cubic-bezier(.34, 1.3, .64, 1), width .65s, height .65s;
}
.card.no-anim { transition: none; }
.face { width: 100%; height: 100%; position: relative; overflow: hidden; background: #333; }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.init {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-name); color: #777; font-size: 40%;
}
/* the name on the picture: white with a black outline, like on TierMaker */
.name {
  position: absolute; left: 2%; right: 2%; top: 4%; z-index: 2; text-align: center;
  font-family: var(--f-name); color: var(--paper); line-height: .95; letter-spacing: .01em;
  text-shadow:
    -.07em -.07em 0 #000, .07em -.07em 0 #000, -.07em .07em 0 #000, .07em .07em 0 #000,
    0 -.09em 0 #000, 0 .09em 0 #000, -.09em 0 0 #000, .09em 0 0 #000;
  overflow: hidden;
}
.name span { display: block; white-space: nowrap; }
.card.in-pool .face { filter: saturate(.85); }
.card.fresh { z-index: 5; }
.card.stamp .face { animation: stamp .55s cubic-bezier(.3, 1.8, .6, 1); }
.card.bump .face { animation: bump .65s ease-out; }
@keyframes stamp { from { transform: scale(1.6); } to { transform: none; } }
@keyframes bump { 30% { transform: scale(1.15); } }

/* ▲ / ▼ / NEU above a card */
.pop {
  position: absolute; bottom: 4%; left: 50%; z-index: 6; white-space: nowrap;
  font-family: var(--f-name); font-size: max(16px, 2.2vh); padding: 0 .3em; border: 2px solid var(--ink);
  animation: popUp 1.6s ease-out forwards;
}
.pop.up { background: #00ff66; color: var(--ink); }
.pop.down { background: #ff0033; color: var(--paper); }
.pop.new { background: var(--blue); color: var(--paper); }
@keyframes popUp {
  from { transform: translate(-50%, 0); opacity: 1; }
  70% { opacity: 1; }
  to { transform: translate(-50%, -1.4em); opacity: 0; }
}

#live {
  position: absolute; right: 8px; top: 8px; z-index: 20;
  font-family: var(--f-type); font-size: min(1.4vh, 1.6vw); color: var(--ink); opacity: .55;
}
#live.on::before { content: "● "; color: #0a0; }

/* ═══ Switch ═══ */
#mode-switch { flex: 0 0 4.5vh; display: flex; gap: 2px; margin-top: 2px; }
#mode-switch button {
  flex: 1 1 0; min-width: 0; border: 0; background: #333; color: var(--paper);
  font-family: var(--f-type); font-size: min(2.2vh, 3.6vw); text-transform: uppercase; cursor: pointer;
}
#mode-switch button[aria-pressed="true"] { background: var(--grey); color: var(--ink); }
.kiosk #mode-switch { display: none; }

#empty {
  position: absolute; left: 20%; right: 8%; top: 35%; z-index: 20; text-align: center;
  background: var(--ink); border: 2px dashed var(--paper); padding: 2vh 3vw;
  font-family: var(--f-type); font-size: min(2vh, 3.4vw); line-height: 1.4;
}

/* ═══ Hover track: new entries search their tier here before they land ═══ */
.items { margin-right: var(--rail-w, 0px); }
#pool-row .items { margin-right: 0; }
#rail {
  position: absolute; z-index: 3; pointer-events: none; display: none;
  border-left: 2px dashed rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .05);
}
#rail.on { display: block; }
.card.hover { z-index: 7; transition: transform .55s cubic-bezier(.34, 1.5, .64, 1), width .4s, height .4s; }
.card.hover .face { outline: 3px dashed var(--paper); outline-offset: -3px; animation: shake .3s steps(2) infinite; }
.card.hover.settled .face { outline-style: solid; outline-color: var(--blue); animation-duration: .12s; }
@keyframes shake {
  from { transform: translate(-1px, 1px) rotate(-2deg); }
  to { transform: translate(1px, -1px) rotate(2deg); }
}

/* ═══ Clearing between the sequences: everything falls off the screen ═══ */
.card.falling { transition: transform 1.1s cubic-bezier(.55, 0, .9, .45) !important; }
</style>
</head>
<body>
<div id="app">
  <div id="title">&nbsp;</div>
  <div id="tierlist"></div>
  <div id="source" hidden></div>
  <div id="pool-row" hidden><div class="label">…</div><div class="items" id="items-pool"></div></div>
  <div id="mode-switch"></div>
  <div id="rail"></div>
  <div id="cards"></div>
  <div id="live">verbinde…</div>
  <div id="empty" hidden></div>
</div>

<script src="shared.js"></script>
<script>
const GAP = 2;        // space between pictures (px)
const STEP_MS = 520;  // how often a hovering entry jumps to a new height
const SWING = 60;     // how wild the hovering is at the start (score points)
const SETTLE = 0.78;  // after this share of the hover time it stays at its final height

// ── State ──
let TIER_IDS = [];
let phase = "separate";
let mixScreen = "inventions";
let parallel = 3;
const lists = {};        // list id → { label, title, source, virtual, entries[], pool[], hovering[] }
const cards = new Map(); // entry id → { el, shown }   (ranked + waiting)
const hovers = new Map();// entry id → { el, slot, start, land, score, prov, timer }
let screens = [];        // the real categories (one screen each)
let screen = null;       // which screen this is
const qs = new URLSearchParams(location.search);
if (qs.get("kiosk")) document.body.classList.add("kiosk");

const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(1, Math.min(100, Math.round(v)));

// which list this screen shows right now (null = empty screen)
function shownId() {
  if (phase === "clearing") return null;
  if (phase === "mix") return screen === mixScreen ? "mix" : null;
  return screen;
}
const shown = () => lists[shownId()] || null;

function tierOfScore(score) {
  const t = TIER_IDS.find((id, i) => score >= tierMins[i]);
  return t || TIER_IDS[TIER_IDS.length - 1];
}
let tierMins = [];

function flag(el, cls, ms) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// "Vivienne Anne Siegenthaler" → ["Vivienne Anne", "Siegenthaler"]
function nameLines(t) {
  const w = t.split(/\s+/).filter(Boolean);
  return w.length < 2 ? [t] : [w.slice(0, -1).join(" "), w[w.length - 1]];
}

// ════════ Build ════════
function buildRows() {
  $("tierlist").innerHTML = TIER_IDS.map(
    (t) => `<div class="row" id="row-${t}" style="--c:var(--tier-${t})">
       <div class="label">${t}</div><div class="items" id="items-${t}"></div></div>`
  ).join("");
  $("tierlist").style.flexGrow = TIER_IDS.length; // "…" row = height of one tier
}

function buildSwitch() {
  $("mode-switch").innerHTML = "";
  screens.forEach((id) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = lists[id].label;
    b.dataset.cat = id;
    b.onclick = () => id !== screen && setScreen(id);
    $("mode-switch").appendChild(b);
  });
  markSwitch();
}
function markSwitch() {
  document.querySelectorAll("#mode-switch button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cat === screen));
}

// throw away all cards and draw the shown list from scratch
function rebuild() {
  hovers.forEach((h) => clearTimeout(h.timer));
  hovers.clear();
  $("cards").innerHTML = "";
  cards.clear();
  layout();
  const L = shown();
  if (L) L.hovering.forEach((ev) => toLocalTime(ev.landAt) > Date.now() && startHover(ev));
}

function setScreen(id) {
  screen = id;
  markSwitch();
  const u = new URL(location.href);
  u.searchParams.set("cat", id);
  history.replaceState(null, "", u);
  rebuild();
}

// title with the number in blue
function renderHeader() {
  const L = shown();
  const own = lists[screen] || {};
  const n = L ? L.entries.length + L.pool.length + L.hovering.length : 0;
  const parts = ((L || own).title || own.label || "").split("{n}");
  const t = $("title");
  t.textContent = "";
  parts.forEach((p, i) => {
    if (i) { const s = document.createElement("span"); s.className = "n"; s.textContent = n; t.append(s); }
    t.append(p);
  });
  // shrink the title until it fits on one line
  t.style.fontSize = "";
  const cs = getComputedStyle(t);
  const pad = parseFloat(cs.paddingLeft) * 2;
  if (t.scrollWidth - pad > t.clientWidth - pad) {
    t.style.fontSize = Math.floor(parseFloat(cs.fontSize) * (t.clientWidth - pad) / (t.scrollWidth - pad)) + "px";
  }
  const src = (L || own).source || "";
  $("source").textContent = src;
  $("source").hidden = !src;
}

// ════════ Layout: the server's ranking decides tier and order ════════
// largest square size at which n pictures fit into the box
function fitSize(w, h, n) {
  for (let s = Math.floor(h); s > 6; s--) {
    const cols = Math.floor((w + GAP) / (s + GAP));
    if (cols > 0 && Math.ceil(n / cols) * (s + GAP) - GAP <= h) return s;
  }
  return 6;
}

// size of the hover track on the right and of the hovering pictures
function railGeometry() {
  const r = $(`row-${TIER_IDS[0]}`);
  const row = r.getBoundingClientRect();
  const free = row.width - r.querySelector(".label").getBoundingClientRect().width;
  const hsize = Math.max(16, Math.min(row.height - 6, (free * 0.3 - 8 * parallel) / parallel));
  return { hsize, width: parallel * (hsize + 8) + 8 };
}

function layout() {
  renderHeader();
  const L = shown();
  $("pool-row").hidden = !(L && L.pool.length);
  $("rail").classList.toggle("on", !!L);
  const app = $("app");
  if (L) {
    app.style.setProperty("--rail-w", "0px");
    const g = railGeometry();
    app.style.setProperty("--rail-w", g.width + "px");
    const origin = app.getBoundingClientRect();
    const tl = $("tierlist").getBoundingClientRect();
    Object.assign($("rail").style, {
      left: tl.right - origin.left - g.width + "px", top: tl.top - origin.top + "px",
      width: g.width + "px", height: tl.height + "px",
    });
  } else {
    app.style.setProperty("--rail-w", "0px");
  }

  const entries = L ? L.entries : [];
  const pool = L ? L.pool : [];
  const ids = new Set([...entries, ...pool].map((e) => e.id));
  for (const [id, c] of cards) if (!ids.has(id)) { c.el.remove(); cards.delete(id); }

  const rows = Object.fromEntries(TIER_IDS.map((t) => [t, []]));
  entries.forEach((e) => (rows[e.tier] || rows[TIER_IDS.at(-1)]).push(e));

  // one picture size for all tiers, so the list looks even (like TierMaker)
  let size = Infinity;
  for (const t of TIER_IDS) {
    if (!rows[t].length) continue;
    const box = $(`items-${t}`).getBoundingClientRect();
    size = Math.min(size, fitSize(box.width, box.height, rows[t].length));
  }
  for (const t of TIER_IDS) placeRow(`items-${t}`, rows[t], size, t);

  // the "…" row has its own size, it can be very full at the start
  if (pool.length) {
    const box = $("items-pool").getBoundingClientRect();
    placeRow("items-pool", pool, fitSize(box.width, box.height, pool.length), "pool");
  }
  hovers.forEach(placeHover);

  const empty = $("empty");
  empty.hidden = !L || !!(entries.length || pool.length || L.hovering.length);
  empty.innerHTML = `Noch keine Bilder.<br>Lege quadratische Bilder in den Ordner<br>public/images/${screen}/`;
}

function placeRow(boxId, list, size, tier) {
  if (!list.length) return;
  const origin = $("app").getBoundingClientRect();
  const box = $(boxId).getBoundingClientRect();
  const cols = Math.max(1, Math.floor((box.width + GAP) / (size + GAP)));
  list.forEach((e, i) => {
    if (hovers.has(e.id)) return;
    let c = cards.get(e.id);
    if (!c) {
      c = { el: makeCard(e), shown: tier };
      cards.set(e.id, c);
    } else if (c.shown !== tier && c.shown !== "pool" && tier !== "pool") {
      flag(c.el, "bump", 650);
    }
    c.shown = tier;
    c.el.classList.toggle("in-pool", tier === "pool");
    placeCard(c.el, box.left - origin.left + (i % cols) * (size + GAP),
              box.top - origin.top + Math.floor(i / cols) * (size + GAP), size);
    if (c.el.classList.contains("no-anim")) { void c.el.offsetWidth; c.el.classList.remove("no-anim"); }
  });
}

function makeCard(e) {
  const el = document.createElement("div");
  el.className = "card no-anim";
  el.innerHTML = '<div class="face"><span class="init"></span></div>';
  el.querySelector(".init").textContent = e.title.slice(0, 1);
  if (e.image) {
    const img = document.createElement("img");
    img.src = e.image;
    img.alt = "";
    img.onerror = () => img.remove();
    el.querySelector(".face").append(img);
  }
  // names only for categories with names: true (the students)
  if (e.named) {
    const lines = nameLines(e.title);
    const name = document.createElement("div");
    name.className = "name";
    lines.forEach((l) => { const s = document.createElement("span"); s.textContent = l; name.append(s); });
    el.querySelector(".face").append(name);
    el.dataset.longest = Math.max(...lines.map((l) => l.length));
  }
  $("cards").appendChild(el);
  return el;
}

function placeCard(el, x, y, size) {
  const s = el.style;
  s.width = size + "px";
  s.height = size + "px";
  s.transform = `translate(${x}px,${y}px)`;
  el.dataset.x = x;
  el.dataset.y = y;
  const name = el.querySelector(".name");
  if (name) {
    // the name gets as big as possible but always fits on the picture
    const fs = Math.min(size * 0.16, (size * 0.94) / (+el.dataset.longest * 0.46));
    name.style.fontSize = Math.max(5, fs) + "px";
  }
  el.querySelector(".init").style.fontSize = size * 0.4 + "px";
}

function pop(el, text, cls) {
  const p = document.createElement("div");
  p.className = "pop " + cls;
  p.textContent = text;
  el.appendChild(p);
  setTimeout(() => p.remove(), 1600);
}

// ════════ Hovering: up and down the track, then into the tier ════════
function startHover(ev) {
  const id = ev.entry.id;
  if (hovers.has(id)) return;
  const L = shown();
  if (L) L.pool = L.pool.filter((p) => p.id !== id);
  // take the picture out of the "…" row if it is there, else make a new one
  let el;
  const c = cards.get(id);
  if (c) { el = c.el; cards.delete(id); el.classList.remove("in-pool"); }
  else el = makeCard(ev.entry);
  el.classList.add("hover");
  const h = { el, slot: ev.slot, start: toLocalTime(ev.startedAt), land: toLocalTime(ev.landAt), score: ev.score, prov: 50, timer: null };
  hovers.set(id, h);
  const step = () => {
    if (hovers.get(id) !== h) return;
    const p = (Date.now() - h.start) / (h.land - h.start);
    if (p >= SETTLE) {
      h.prov = h.score;
      el.classList.add("settled");
    } else {
      // wild at first, calmer towards the end; sometimes it fakes going the other way
      const calm = 1 - p / SETTLE;
      h.prov = clamp(h.score + (Math.random() * 2 - 1) * SWING * calm);
    }
    placeHover(h);
    if (p < 1) h.timer = setTimeout(step, STEP_MS * (0.7 + Math.random() * 0.6));
  };
  layout();
  step();
}

function placeHover(h) {
  if (!TIER_IDS.length) return;
  const origin = $("app").getBoundingClientRect();
  const rail = $("rail").getBoundingClientRect();
  const { hsize } = railGeometry();
  const band = tierOfScore(h.prov);
  const i = TIER_IDS.indexOf(band);
  const hi = i === 0 ? 100 : tierMins[i - 1];
  const lo = Math.max(1, i === TIER_IDS.length - 1 ? 1 : tierMins[i]);
  const row = $(`row-${band}`).getBoundingClientRect();
  const y = row.top - origin.top + 2 + ((hi - h.prov) / Math.max(1, hi - lo)) * Math.max(0, row.height - hsize - 4);
  const x = rail.left - origin.left + 8 + h.slot * (hsize + 8);
  h.band = band;
  placeCard(h.el, x, y, hsize);
}


// the server says: it landed
function landHover(ev) {
  const id = ev.entry.id;
  const h = hovers.get(id);
  if (h) {
    clearTimeout(h.timer);
    hovers.delete(id);
    h.el.classList.remove("hover", "settled");
    cards.set(id, { el: h.el, shown: ev.entry.tier });
  }
  layout();
  const c = cards.get(id);
  if (!c) return;
  c.el.classList.add("fresh");
  setTimeout(() => c.el.classList.remove("fresh"), 1500);
}

// ════════ Clearing between the sequences ════════
function fallOff() {
  hovers.forEach((h) => clearTimeout(h.timer));
  const els = [...cards.values(), ...hovers.values()].map((c) => c.el);
  hovers.clear();
  cards.clear();
  const H = window.innerHeight;
  els.forEach((el) => {
    el.classList.remove("hover", "settled", "no-anim");
    el.classList.add("falling");
    el.style.transitionDelay = Math.random() * 0.7 + "s";
    const x = +el.dataset.x + (Math.random() * 2 - 1) * 120;
    el.style.transform = `translate(${x}px,${H + 80}px) rotate(${(Math.random() * 2 - 1) * 70}deg)`;
  });
  setTimeout(() => els.forEach((el) => el.remove()), 2000);
  $("rail").classList.remove("on");
  $("pool-row").hidden = true;
}

// ════════ Live connection ════════
connectDisplay({
  onSnapshot(snap) {
    const first = !TIER_IDS.length;
    TIER_IDS = snap.tiers.map((t) => t.id);
    tierMins = snap.tiers.map((t, i) => (i === snap.tiers.length - 1 ? -Infinity : t.min));
    mixScreen = snap.mixScreen;
    parallel = snap.parallel || 3;
    const before = shownId();
    phase = snap.phase;
    snap.categories.forEach((c) => {
      lists[c.name] = { label: c.label, title: c.title, source: c.source, virtual: c.virtual,
                        entries: c.entries, pool: c.pool, hovering: c.hovering };
    });
    screens = snap.categories.filter((c) => !c.virtual).map((c) => c.name);
    if (first) buildRows();
    buildSwitch();
    const want = screen || qs.get("cat");
    screen = lists[want] && !lists[want].virtual ? want : screens[0];
    markSwitch();
    if (first || before !== shownId() || cards.size === 0) rebuild();
    else {
      layout();
      shown()?.hovering.forEach((ev) => toLocalTime(ev.landAt) > Date.now() && startHover(ev));
    }
  },
  onHover(ev) {
    const L = lists[ev.category];
    if (!L) return;
    L.hovering.push(ev);
    L.pool = L.pool.filter((p) => p.id !== ev.entry.id);
    if (ev.category === shownId()) startHover(ev);
  },
  onCommit(ev) {
    const L = lists[ev.category];
    if (ev.replay || !L) return; // the snapshot is already newer than replays
    L.entries = ev.entries;
    L.hovering = L.hovering.filter((h) => h.entry.id !== ev.entry.id);
    if (ev.category === shownId()) landHover(ev);
  },
  onDrift(ev) {
    const L = lists[ev.category];
    if (ev.replay || !L) return;
    L.entries = ev.entries;
    if (ev.category !== shownId()) return;
    layout();
    const c = cards.get(ev.id);
    const moved = ev.after.rank !== ev.before.rank || ev.after.tier !== ev.before.tier;
    if (c && moved) pop(c.el, ev.change > 0 ? "▲" : "▼", ev.change > 0 ? "up" : "down");
  },
  onRoster(ev) {
    const L = lists[ev.category];
    if (!L) return;
    L.entries = ev.entries;
    L.pool = ev.pool;
    if (ev.category === shownId()) layout();
  },
  onPhase(ev) {
    if (ev.replay || ev.phase !== "clearing") return;
    phase = "clearing";
    fallOff();
    renderHeader();
  },
  onStatus(s) {
    $("live").textContent = s === "live" ? "LIVE" : s;
    $("live").classList.toggle("on", s === "live");
  },
});

window.addEventListener("resize", layout);
</script>
</body>
</html>
