<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Rankmania</title>
<style>
/*
  Rankmania look (design sketch): black title block — black tier letters on a grey gradient —
  "…" row with the entries not ranked yet — hover track on the right — vertical side strip.
  Works in landscape and portrait. All cards sit absolutely in #cards and are placed by layout().
  The ranking comes ONLY from the server; this page just shows it.
*/
:root {
  --ink: #000; --paper: #fff;
  --shade: #666666;                                /* the grey band that slowly runs down the background */
  --render-time: 14s;                              /* how long one pass of the band takes */
  --band: 18%;                                     /* half the height of the grey band (share of the screen) */
  --vig-blur: .14;                                 /* vignette blur, as a share of the icon size */
  --vig-spread: .1;                                /* vignette spread, as a share of the icon size */
  --name: #D7FF37;                                 /* color of the names on the pictures */
  --vig-undecided: transparent;                    /* vignette while an entry is still hovering (transparent = none) */
  --vig-up: #00ff00;                               /* vignette after moving up */
  --vig-down: #ff0000;                             /* vignette after moving down */
  --frame: 4px;                                    /* white frame around everything */
  --f-type: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-name: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --label-w: min(14vh, 16vw);
  --side-w: min(2.4vh, 4.4vw);
  --title-fs: min(6.4vh, 7.6vw);                   /* font size of the black title bar, the same in every mode */
  --title-h: calc(var(--title-fs) * 2.69);         /* its height: always room for two lines */
  --row-gap: 3px;                                  /* white line between the tiers (keep in sync with ROW_GAP) */
  --pod-top-bg: #00ff00;                           /* the mix, left screen: background behind the top 3 */
  --pod-bottom-bg: #ee3322;                        /* the mix, right screen: background behind the bottom 3 */
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
#app {
  width: 100%; height: 100%; display: flex; flex-direction: row; overflow: hidden; position: relative;
  background: var(--paper); gap: var(--frame);
  padding: calc(var(--frame) + env(safe-area-inset-top, 0px)) calc(var(--frame) + env(safe-area-inset-right, 0px))
           calc(var(--frame) + env(safe-area-inset-bottom, 0px)) calc(var(--frame) + env(safe-area-inset-left, 0px));
}
#stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; position: relative;
         background: var(--paper); overflow: hidden; isolation: isolate; }
/* the background "renders": mostly white, a soft grey band slowly runs from top to bottom, again and again */
#stage::before {
  content: ""; position: absolute; left: 0; right: 0; top: -100%; height: 200%; z-index: -1; pointer-events: none;
  background:
    linear-gradient(90deg, var(--label-gap, var(--paper)) 0 var(--label-w), transparent var(--label-w)),
    repeating-linear-gradient(180deg, var(--paper) 0%, var(--paper) calc(50% - var(--band)), var(--shade) 50%,
                              var(--paper) calc(50% + var(--band)), var(--paper) 100%) 0 0 / 100% 50%;
  animation: render var(--render-time) linear infinite var(--render-dir, normal);
}
@keyframes render { from { transform: translateY(0); } to { transform: translateY(50%); } }

/* ═══ Title ═══ */
#title {
  flex: 0 0 auto; background: var(--ink); color: var(--paper); text-align: left;
  font-family: var(--f-type); font-weight: 400; font-size: var(--title-fs); line-height: 1.02;
  letter-spacing: -.01em; padding: .3em .5em .35em; overflow: hidden;
  height: var(--title-h); /* always room for two lines, so the icon size never changes */
  box-shadow: 0 var(--row-gap) 0 var(--paper); /* the white line under the title, always white (the band runs behind it) */
  display: flex; align-items: flex-start; /* one or two lines: they start at the top */
}
#title .t { display: block; text-wrap: balance; } /* two lines of about the same length instead of one lonely word */
#title .n { text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .12em; }

/* ═══ Tier rows ═══ */
#tierlist { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--row-gap); padding-top: var(--row-gap); }
.row { flex: 0 0 auto; display: flex; height: 80px; transition: height .6s ease; }
.label {
  flex: 0 0 var(--label-w); display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--paper); font-family: var(--f-type); font-weight: 400; font-size: calc(var(--tile, 80px) * .6);
}
.items { flex: 1; min-width: 0; }

#source { display: none; }
#pool-row { flex: 1 1 auto; display: flex; min-height: 0; margin-top: var(--row-gap); } /* the waiting row gets all the space that is left */

/* ═══ Side strip: vertical texts, read from bottom to top ═══ */
/* the source sits fixed at the top; the verdict dots grow up from the bottom and slide UNDER the source */
#side {
  flex: 0 0 var(--side-w); position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
  font-family: var(--f-type); font-size: min(1.1vh, 1.9vw); color: var(--ink); white-space: nowrap; overflow: hidden;
}
#side span { writing-mode: vertical-rl; transform: rotate(180deg); }
#side-url, #side-source { position: relative; z-index: 1; background: var(--paper); padding-bottom: .6em; }
#side-url:empty { display: none; }
#side-votes { position: absolute; bottom: 0; left: 0; right: 0; display: flex; align-items: center;
              font-size: 1.3em; line-height: 1.05; letter-spacing: .05em; }
#side-votes .good { color: #00ff00; }
#side-votes .bad { color: #ff0000; }

/* ═══ Cards ═══ */
#cards { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.card {
  position: absolute; top: 0; left: 0; will-change: transform;
  transition: transform 1.4s cubic-bezier(.45, 0, .2, 1), width .65s, height .65s;
}
.card.no-anim { transition: none; }
.face { width: 100%; height: 100%; position: relative; overflow: hidden; background: var(--paper); }
/* vignette (inner shadow: blur 19, spread 14 at ~135 px, scaled to the icon size).
   Its color shows the state: white = ranked, none = waiting in the "…" row or still undecided (hovering),
   green = just moved up, red = just moved down. */
.face::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
               box-shadow: inset 0 0 calc(var(--s, 100px) * var(--vig-blur)) calc(var(--s, 100px) * var(--vig-spread)) var(--vig, #fff);
               transition: box-shadow 1s ease; }
.card.hover .face { --vig: var(--vig-undecided); }
.card.mark-up .face { --vig: var(--vig-up); }
.card.mark-down .face { --vig: var(--vig-down); }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.init {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--f-name); color: #777; font-size: 40%;
}
/* the name on the picture: lime (--name) Helvetica Regular with a thin black outline */
.name {
  position: absolute; left: 2%; right: 2%; top: 4%; z-index: 2; text-align: center;
  font-family: var(--f-name); font-weight: 400; color: var(--name); line-height: 1.12; letter-spacing: -.01em;
  padding-bottom: .12em;
  text-shadow:
    -.035em -.035em 0 #000, .035em -.035em 0 #000, -.035em .035em 0 #000, .035em .035em 0 #000,
    0 -.05em 0 #000, 0 .05em 0 #000, -.05em 0 0 #000, .05em 0 0 #000;
  overflow: hidden;
}
.name span { display: block; white-space: nowrap; }
.card.in-pool .face { --vig: transparent; } /* no vignette while waiting in the "…" row */
.card.fresh { z-index: 5; }

/* connection status: only visible when the connection is lost */
#live {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20;
  font-family: var(--f-type); font-size: 14px; background: #000; color: #fff; padding: 4px 10px;
}
#live.on { display: none; }

/* ═══ Switch ═══ */
#mode-switch { flex: 0 0 4.5vh; display: flex; gap: 2px; margin-top: auto; }
#mode-switch button {
  flex: 1 1 0; min-width: 0; border: 0; background: #000; color: var(--paper);
  font-family: var(--f-type); font-size: min(2.2vh, 3.6vw); cursor: pointer;
}
#mode-switch button[aria-pressed="true"] { background: var(--paper); color: var(--ink); outline: 1px solid #000; outline-offset: -1px; }
.kiosk #mode-switch { display: none; }

/* a verdict from RankFeed: the whole background flashes green or red, then fades out */
/* only behind the main part: never over the title, the letter column, the white lines or the side strip */
#flash { position: absolute; left: var(--label-w); right: 0; top: calc(var(--title-h) + var(--row-gap)); bottom: 0;
         z-index: -1; opacity: 0; pointer-events: none; }
/* after the mix: slowly to black, then sequence 1 fades in */
#fade { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; }

/* ═══ The mix ("everything"): one shared list, three ways of showing it (MIX_VIEW) ═══ */
/* middle screen: the full list, the graphics and background inverted (light becomes dark),
   but the pictures and the yellow names stay as they are (inverted twice) */
body.mix-full { background: #000; }
body.mix-full #app { filter: invert(1); }
body.mix-full .face img, body.mix-full .name, body.mix-full #title, body.mix-full .label { filter: invert(1); }
/* vignettes stay white, green and red on the inverted screen (so they are set to the opposite colors) */
body.mix-full { --vig-up: #ff00ff; --vig-down: #00ffff; }
body.mix-full .face { --vig: #000; }
/* the white frame, the white lines between the tier letters and the white side strip stay as in sequence 1 */
body.mix-full #app { background: #000; --label-gap: #000; }
body.mix-full #tierlist { padding-top: 0; border-top: var(--row-gap) solid #000; } /* the white line under the title, full width */
body.mix-full #side { color: var(--paper); }
body.mix-full #side-url, body.mix-full #side-source { background: #000; } /* (white after the inversion) */
body.mix-full #side-votes .good { color: #ff00ff; }
body.mix-full #side-votes .bad { color: #00ffff; }
/* left and right screen: the same frame, title bar and side strip as everywhere; instead of the tiers,
   three entries, big, overlapping, slightly tilted and shaking (POD_LAYOUT), on green / red */
body.mix-top #tierlist, body.mix-top #pool-row, body.mix-top #cards, body.mix-top #rail,
body.mix-bottom #tierlist, body.mix-bottom #pool-row, body.mix-bottom #cards, body.mix-bottom #rail { display: none; }
#pod-area { position: absolute; left: 0; right: 0; top: calc(var(--title-h) + var(--row-gap)); bottom: 0; overflow: hidden;
            container-type: size; --u: min(100cqw, 54cqh); }
body.mix-top #pod-area { background: var(--pod-top-bg); }
body.mix-bottom #pod-area { background: var(--pod-bottom-bg); }
#pod-flash { position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none; } /* over the pictures, so it shows on green and red too */
#pod-items { position: absolute; inset: 0; z-index: 1; }
.pod { position: absolute; width: calc(var(--w) * var(--u)); aspect-ratio: 1;
       animation: pod-shake var(--d, 3s) ease-in-out var(--delay, 0s) infinite alternate; }
.pod .face { box-shadow: 0 .6vmin 2vmin rgba(0, 0, 0, .25); }
@keyframes pod-shake {
  0%   { transform: translate(-.4vmin, .3vmin) rotate(calc(var(--r) - 1.2deg)); }
  50%  { transform: translate(.3vmin, -.5vmin) rotate(calc(var(--r) + .4deg)); }
  100% { transform: translate(.5vmin, .4vmin) rotate(calc(var(--r) + 1.4deg)); }
}


#empty {
  position: absolute; left: 20%; right: 8%; top: 35%; z-index: 20; text-align: center;
  background: var(--ink); color: var(--paper); border: 2px dashed var(--paper); padding: 2vh 3vw;
  font-family: var(--f-type); font-size: min(2vh, 3.4vw); line-height: 1.4;
}

/* ═══ Hover track: new entries search their tier here before they land ═══ */
.items { margin-right: var(--rail-w, 0px); }
#pool-row .items { margin-right: 0; }
#rail {
  position: absolute; z-index: 3; pointer-events: none; display: none;
  border-left: 0;
}
#rail.on { display: block; }
.card.hover { z-index: 7; transition: transform .7s cubic-bezier(.45, 0, .2, 1), width .4s, height .4s; }
.card.hover .face { animation: shake .3s steps(2) infinite; }
.card.hover.settled .face { animation-duration: .12s; }
@keyframes shake {
  from { transform: translate(-1px, 1px) rotate(-2deg); }
  to { transform: translate(1px, -1px) rotate(2deg); }
}

/* ═══ Clearing between the sequences: everything falls off the screen ═══ */
.card.falling { transition: transform 1.1s cubic-bezier(.55, 0, .9, .45) !important; }

/* ═══ The intermission after sequence 1 (45 s): headline, the list's terminal replayed, and one big
   progress bar running across all three screens (left → middle → right) ═══ */
#black { position: fixed; inset: 0; z-index: 40; background: var(--paper); color: #fff; display: flex; flex-direction: column;
         gap: var(--row-gap); padding: var(--frame); overflow: hidden; } /* white frame and white line under the title, like everywhere */
#inter-main { flex: 1 1 auto; min-height: 0; position: relative; background: #000; overflow: hidden;
              margin-right: calc(var(--frame) + var(--side-w)); }
#inter-head { flex: 0 0 auto; box-shadow: inset 0 0 0 3px #fff; background: #000; font-family: var(--f-type); font-weight: 400;
              font-size: var(--title-fs); line-height: 1.02; letter-spacing: -.01em; padding: .3em .5em .35em; height: var(--title-h);
              display: flex; flex-direction: column; justify-content: flex-start; margin-right: calc(var(--frame) + var(--side-w));
              position: relative; z-index: 2; }
#inter-head i { display: block; }
#inter-text { display: block; min-height: 1.02em; } /* keeps its line even while it is empty */
@keyframes blink { 50% { opacity: 0; } }
#inter-log { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
             font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: min(1.25vh, 2.1vw); line-height: 1.35;
             white-space: pre; padding: .6em .4em 0; }
#inter-log .dim { opacity: .55; }
#inter-bar { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
/* the loading bar: one blue gradient that fills smoothly across all three screens (left → middle → right) */
#inter-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1f45ff, #4fb2ff 50%, #d2e4ff) 0 0 / 300% 100%; }

#soundhint {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25;
  background: #000; color: #fff; font-family: var(--f-type); font-size: 14px; padding: 6px 12px;
}

/* hidden icon size slider: press S or double-click the title to show/hide */
#sizer {
  position: absolute; left: 50%; top: 12%; transform: translateX(-50%); z-index: 30;
  background: #000; color: #fff; border: 1px solid #fff; padding: 10px 14px;
  font-family: var(--f-type); font-size: 14px;
}
#sizer input[type=range] { width: min(50vw, 360px); vertical-align: middle; }
#sizer > div { margin: 6px 0; }
</style>
</head>
<body>
<!-- the mix on the left and right screen: three big entries -->
<div id="fade"></div>
<div id="app">
  <div id="stage">
    <div id="flash"></div>
    <div id="title">&nbsp;</div>
    <!-- the mix on the left and right screen: three big entries instead of the tiers (same frame, title and side strip) -->
    <div id="pod-area" hidden><div id="pod-flash"></div><div id="pod-items"></div></div>
    <div id="tierlist"></div>
    <div id="source" hidden></div>
    <div id="pool-row" hidden><div class="label">…</div><div class="items" id="items-pool"></div></div>
    <div id="mode-switch"></div>
  </div>
  <div id="side"><span id="side-url"></span><span id="side-source"></span><span id="side-votes"></span></div>
  <div id="rail"></div>
  <div id="cards"></div>
  <div id="live">verbinde…</div>
  <div id="empty" hidden></div>
  <div id="black" hidden><div id="inter-head"><i>intermission</i><span id="inter-text"></span></div>
    <div id="inter-main"><div id="inter-log"></div><div id="inter-bar"><div id="inter-fill"></div></div></div></div>
  <div id="soundhint" hidden>Click anywhere to turn on sound · M = mute</div>
  <div id="sizer" hidden>
    <div>Icon size <input id="size" type="range" min="0" max="400" step="2"> <span id="sizeval"></span>
      <button type="button" id="sizeauto">Auto</button></div>
    <div>Shade <input id="shade" type="color"> <span id="shadeval"></span></div>
    <div>Band width <input id="band" type="range" min="4" max="48" step="1"> <span id="bandval"></span></div>
    <div>Speed <input id="render" type="range" min="3" max="60" step="1"> <span id="renderval"></span></div>
    <div>Direction <button type="button" id="renderdir"></button></div>
    <div>Vignette blur <input id="vblur" type="range" min="0" max="0.4" step="0.01"> <span id="vblurval"></span></div>
    <div>Vignette spread <input id="vspread" type="range" min="0" max="0.3" step="0.01"> <span id="vspreadval"></span></div>
    <div><button type="button" id="bgreset">Reset background and vignette</button></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
const SITE_TEXT = ""; // top text in the side strip ("" = none)
const DOT = "\u25CF";                        // the verdict dots at the bottom of the side strip: ● green = good, red = bad
const MAX_DOTS = 80;                        // at most this many (the newest)
const GAP = 0;        // space between pictures in the same tier (px), 0 = they touch
const ROW_GAP = 3;    // space between the tiers (px): the white line between the letter boxes
const TILE_SIZE = 0;  // icon size in px, e.g. 70 — or 0 = automatic (as big as the list allows)
const POOL_SCALE = 0.75; // icons in the "…" row are at most this big compared to the others (they get smaller if many wait)
const STEP_MS = 750;  // how often a hovering entry jumps to a new height
const SWING = 60;     // how wild the hovering is at the start (score points)
const SETTLE = 0.78;  // after this share of the hover time it stays at its final height

// ── State ──
let TIER_IDS = [];
let phase = "separate";
let blackTimer = null;
// ── the intermission: what each screen says, and its terminal replay
const INTER_TEXT = { corporations: "Analyzing Results …", students: "Mediating Rankings …", things: "Preparing print …" };
const INTER_VARS = {
  _any: ["attention_yield", "consensus_drift", "taste_conformity", "click_probability", "outrage_elasticity", "cultural_half_life",
         "nostalgia_coeff", "trust_decay", "virality_index", "aesthetic_entropy", "symmetry_bias", "market_resonance", "meme_potential"],
  corporations: ["brand_gravity", "lobby_mass", "logo_symmetry", "apology_frequency", "shareholder_mood", "greenwashing_index"],
  students: ["eye_contact_ratio", "group_chat_latency", "deadline_tolerance", "coffee_dependency", "portfolio_gloss", "laserpointer_grace"],
  things: ["world_change_factor", "sleep_induction", "grandparent_explainability", "nostalgia_load", "daily_use_index"],
};
const INTER_TAG = { corporations: "COR", students: "STU", things: "THG" };
let inter = null; // { start, end, lines, shown, raf }
function h01(str) {
  let x = 2166136261;
  for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
  x ^= x >>> 13; x = Math.imul(x, 0x5bd1e995); x ^= x >>> 15;
  return (x >>> 0) / 4294967296;
}
// the terminal lines of this screen's round, as the brain showed them (same made-up variables)
function interLines(entries) {
  const T = INTER_TAG[screen] || "LST", pool = [...INTER_VARS._any, ...(INTER_VARS[screen] || [])], out = [];
  const t0 = Date.now() - entries.length * 9000;
  const fmt = (v, n) => { const k = h01(n) * 3; return k < 1 ? v.toFixed(4) : k < 2 ? (v * 100).toFixed(1) + "%" : (v * 1000 - 500).toFixed(2); };
  [...entries].sort((a, b) => h01(a.id) - h01(b.id)).forEach((e, i) => {
    const clock = new Date(t0 + i * 9000).toTimeString().slice(0, 8);
    out.push(["", ""], [`[${clock}] ${T}   EVALUATE  ${e.title}`, ""]);
    pool.map((v) => [v, h01(e.id + v)]).sort((a, b) => a[1] - b[1]).slice(0, 4)
      .forEach(([v]) => out.push([`           ${T}   ${(v + " ").padEnd(30, ".")} ${fmt(h01(v + "|" + e.id), v)}`, ""]));
    out.push([`           ${T}   RESULT    → TIER ${e.tier}   #${e.rank}/${entries.length}`, "dim"]);
  });
  return out.length ? out : [["(no entries)", "dim"]];
}
function startIntermission(start, end) {
  stopIntermission();
  const entries = (lists[screen] && lists[screen].entries) || [];
  inter = { start, end, lines: interLines(entries), shown: 0 };
  inter.text = INTER_TEXT[screen] || "Processing …";
  $("inter-text").textContent = "";
  $("inter-log").textContent = "";
  const idx = Math.max(0, screens.indexOf(screen)), n = Math.max(1, screens.length);
  $("inter-fill").style.backgroundPosition = `${(idx / Math.max(1, n - 1)) * 100}% 0`; // one gradient across all screens
  const step = () => {
    if (!inter) return;
    const now = Date.now();
    $("black").hidden = now < inter.start;
    // the second headline line types itself, waits, and types again
    const cyc = (now - inter.start) % 6000, chars = Math.min(inter.text.length, Math.floor(cyc / 90));
    const typed = cyc > 4800 ? "" : inter.text.slice(0, chars);
    if ($("inter-text").textContent !== typed) $("inter-text").textContent = typed;
    const p = Math.max(0, Math.min(1, (now - inter.start) / (inter.end - inter.start)));
    $("inter-fill").style.width = Math.max(0, Math.min(1, p * n - idx)) * 100 + "%"; // this screen's third of the bar
    const want = Math.floor(p * inter.lines.length * 1.05);
    const log = $("inter-log");
    while (inter.shown < Math.min(want, inter.lines.length)) {
      const [text, cls] = inter.lines[inter.shown++];
      const d = document.createElement("div");
      d.textContent = text || " ";
      if (cls) d.className = cls;
      log.append(d);
      while (log.children.length > 400) log.firstChild.remove();
    }
    inter.raf = requestAnimationFrame(step);
  };
  step();
}
function stopIntermission() {
  if (inter) cancelAnimationFrame(inter.raf);
  inter = null;
  $("black").hidden = true;
}
let parallel = 3;
const lists = {};        // list id → { label, title, source, virtual, entries[], pool[], hovering[] }
const cards = new Map(); // entry id → { el, shown }   (ranked + waiting)
const hovers = new Map();// entry id → { el, slot, start, land, score, prov, timer }
let screens = [];
let titles = {};         // screen → headline, chosen by the server        // the real categories (one screen each)
let screen = null;       // which screen this is
const qs = new URLSearchParams(location.search);
if (qs.get("kiosk")) document.body.classList.add("kiosk");

const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(1, Math.min(100, Math.round(v)));

// ── the mix: every screen shows the same shared list, each in its own way
//    top = the top 3 big on green, full = the whole tierlist inverted, bottom = the bottom 3 big
const MIX_VIEW = { corporations: "top", students: "full", things: "bottom" };
// where the three big pictures sit (share of the screen; w = width, r = tilt in degrees, z = stacking).
// Top: #1 biggest at the top. Bottom: the last place biggest, at the bottom.
const POD_TITLE = { top: "Top 3 of Everything", bottom: "Bottom 3 of Everything" };
const POD_LAYOUT = {
  top: [
    { x: 4, y: 4, w: 0.74, r: 5, z: 1 },     // #1
    { x: 46, y: 40, w: 0.48, r: 3, z: 2 },   // #2
    { x: 16, y: 63, w: 0.44, r: -14, z: 3 }, // #3
  ],
  bottom: [
    { x: 8, y: 4, w: 0.44, r: -12, z: 3 },   // third last
    { x: 44, y: 22, w: 0.48, r: 3, z: 2 },   // second last
    { x: 0, y: 50, w: 0.74, r: 4, z: 1 },    // last
  ],
};
let podKey = "";
let lastView = null;
let holdMix = false, holdTimer = null; // while fading out after the mix, the mix view stays on screen
const mixOn = () => phase === "mix" || holdMix;
function renderMixView() {
  const view = mixOn() ? MIX_VIEW[screen] || "full" : null;
  if (view !== lastView) { lastView = view; setTimeout(renderHeader); } // the title is measured again once it is visible
  document.body.classList.toggle("mix-full", view === "full");
  document.body.classList.toggle("mix-top", view === "top");
  document.body.classList.toggle("mix-bottom", view === "bottom");
  const pod = $("pod-area");
  pod.hidden = view !== "top" && view !== "bottom";
  if (pod.hidden) { podKey = ""; return; }
  const all = (lists.mix && lists.mix.entries) || [];
  const three = view === "top" ? all.slice(0, 3) : all.slice(-3);
  const key = view + "|" + three.map((e) => e.id + "#" + e.rank).join(",") + "|" + innerWidth + "x" + innerHeight;
  if (key === podKey) return;
  podKey = key;
  const area = $("pod-items");
  area.innerHTML = "";
  three.forEach((e, i) => {
    const spot = POD_LAYOUT[view][view === "top" ? i : 3 - three.length + i];
    const el = document.createElement("div");
    el.className = "pod";
    el.style.cssText = `left:${spot.x}%;top:${spot.y}%;z-index:${spot.z};--w:${spot.w};--r:${spot.r}deg;--d:${2.2 + i * 0.7}s;--delay:${-i * 0.9}s`;
    el.innerHTML = '<div class="face"><span class="init"></span></div>';
    el.querySelector(".init").textContent = e.title.slice(0, 1);
    if (e.image) { const img = document.createElement("img"); img.src = e.image; img.alt = ""; img.onerror = () => img.remove(); el.querySelector(".face").append(img); }
    const lines = nameLines(e.title);
    const name = document.createElement("div");
    name.className = "name";
    lines.forEach((l) => { const sp = document.createElement("span"); sp.textContent = l; name.append(sp); });
    el.querySelector(".face").append(name);
    area.append(el);
    // the same yellow name as in the list: as big as possible, always fitting on the picture
    const size = el.offsetWidth || 300; // without the tilt
    const longest = Math.max(...lines.map((l) => l.length));
    name.style.fontSize = Math.max(8, Math.min(size * 0.17, (size * 0.92) / (longest * 0.54))) + "px";
    el.querySelector(".init").style.fontSize = size * 0.4 + "px";
    // vignette: always green on the top 3, always red on the bottom 3
    const face = el.querySelector(".face");
    face.style.setProperty("--vig", view === "top" ? "var(--vig-up)" : "var(--vig-down)");
    face.style.setProperty("--s", size + "px");
  });
}
setInterval(renderMixView, 400);

// which list this screen shows right now (null = empty screen)
function shownId() {
  if (phase === "clearing") return null;
  if (phase === "mix") return "mix"; // the one shared list (each screen shows it its own way, see MIX_VIEW)
  return screen;
}
const shown = () => lists[shownId()] || null;

function tierOfScore(score) {
  const t = TIER_IDS.find((id, i) => score >= tierMins[i]);
  return t || TIER_IDS[TIER_IDS.length - 1];
}
let tierMins = [];

function flag(el, cls, ms) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// "Vivienne Anne Siegenthaler" → ["Vivienne Anne", "Siegenthaler"]
function nameLines(t) {
  const w = t.split(/\s+/).filter(Boolean);
  return w.length < 2 ? [t] : [w.slice(0, -1).join(" "), w[w.length - 1]];
}

// ════════ Build ════════
function buildRows() {
  $("tierlist").innerHTML = TIER_IDS.map(
    (t) => `<div class="row" id="row-${t}" style="--c:var(--tier-${t})">
       <div class="label">${t}</div><div class="items" id="items-${t}"></div></div>`
  ).join("");
}

function buildSwitch() {
  $("mode-switch").innerHTML = "";
  screens.forEach((id) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = lists[id].label;
    b.dataset.cat = id;
    b.onclick = () => id !== screen && setScreen(id);
    $("mode-switch").appendChild(b);
  });
  markSwitch();
}
function markSwitch() {
  document.querySelectorAll("#mode-switch button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cat === screen));
}

// throw away all cards and draw the shown list from scratch
function rebuild() {
  hovers.forEach((h) => clearTimeout(h.timer));
  hovers.clear();
  $("cards").innerHTML = "";
  cards.clear();
  layout();
  const L = shown();
  if (L) L.hovering.forEach((ev) => toLocalTime(ev.landAt) > Date.now() && startHover(ev));
}

function setScreen(id) {
  screen = id;
  try { userSize = +localStorage.getItem(sizeKey()) || 0; } catch { userSize = 0; }
  markSwitch();
  const u = new URL(location.href);
  u.searchParams.set("cat", id);
  history.replaceState(null, "", u);
  rebuild();
}

// title with the number in blue
// category words in the titles are set in italic
const ITALIC_WORDS = /\b(Students|Student|Things|Thing|Corporations|Brands|Businesses|Companies|Everything|People|Capital)\b/g;
function appendItalic(el, text) {
  let last = 0;
  text.replace(ITALIC_WORDS, (m, _w, at) => {
    if (at > last) el.append(text.slice(last, at));
    const i = document.createElement("i"); i.textContent = m; el.append(i);
    last = at + m.length;
    return m;
  });
  if (last < text.length) el.append(text.slice(last));
}
function renderHeader() {
  const L = shown();
  const own = lists[screen] || {};
  const n = L ? L.entries.length + L.pool.length + L.hovering.length : 0;
  // the headline the brain picked for this screen (edited on /admin.html); otherwise the list's title
  // the left and right screen in the mix: "Top 3 of Everything" / "Bottom 3 of Everything"
  const podView = mixOn() && (MIX_VIEW[screen] === "top" || MIX_VIEW[screen] === "bottom") ? MIX_VIEW[screen] : null;
  const raw = podView ? POD_TITLE[podView] : titles[screen] || (L || own).title || own.label || "";
  const box = $("title");
  box.textContent = "";
  const t = document.createElement("span");
  t.className = "t";
  box.append(t);
  // always two lines: break where the two lines get about equally long (so the lower line is never empty)
  const words = raw.trim().split(/\s+/);
  const len = (w) => w.join(" ").replace(/\{n\}/g, String(n)).length;
  let cut = words.length;
  if (words.length > 1) {
    let best = Infinity;
    for (let k = 1; k < words.length; k++) {
      const d = Math.abs(len(words.slice(0, k)) - len(words.slice(k)));
      if (d < best) { best = d; cut = k; }
    }
  }
  const line = (text) => text.split("{n}").forEach((p, i) => {
    if (i) { const s = document.createElement("span"); s.className = "n"; s.textContent = n; t.append(s); }
    appendItalic(t, p);
  });
  line(words.slice(0, cut).join(" "));
  if (cut < words.length) { t.append(document.createElement("br")); line(words.slice(cut).join(" ")); }
  // a headline longer than two lines gets smaller, the block keeps its height
  t.style.fontSize = "";
  for (let k = 0; k < 12 && box.clientHeight && t.offsetHeight > box.clientHeight - 4; k++) { // (not while hidden)
    t.style.fontSize = parseFloat(getComputedStyle(t).fontSize) * 0.92 + "px";
  }
  const src = (L || own).source || "";
  if ($("side-source").textContent !== src) $("side-source").textContent = src;
  if ($("side-url").textContent !== SITE_TEXT) $("side-url").textContent = SITE_TEXT;
}

// ════════ Layout: the server's ranking decides tier and order ════════
// largest square size at which n pictures fit into the box
function fitSize(w, h, n) {
  for (let s = Math.floor(h); s > 6; s--) {
    const cols = Math.floor((w + GAP) / (s + GAP));
    if (cols > 0 && Math.ceil(n / cols) * (s + GAP) - GAP <= h) return s;
  }
  return 6;
}

// size of the hover track on the right and of the hovering pictures
// the hover track is exactly one icon wide, and the hovering icon has the same size as all others
function railGeometry() {
  const hsize = fixed.tier || 80;
  return { hsize, width: hsize + 16 };
}

function layout() {
  renderHeader();
  renderVotes();
  const L = shown();
  $("pool-row").hidden = !L; // stays even when empty, so the icon size never changes
  $("rail").classList.toggle("on", !!L);
  const app = $("app");

  const entries = L ? L.entries : [];
  const pool = L ? L.pool : [];
  const ids = new Set([...entries, ...pool].map((e) => e.id));
  for (const [id, c] of cards) if (!ids.has(id)) { c.el.remove(); cards.delete(id); }

  const rows = Object.fromEntries(TIER_IDS.map((t) => [t, []]));
  entries.forEach((e) => (rows[e.tier] || rows[TIER_IDS.at(-1)]).push(e));

  // ONE icon size for everything. A full tier never shrinks its icons: its row gets another line.
  const sz = L ? tileSizes(L) : { tier: 80, pool: 40, cols: 1, pcols: 1 };
  app.style.setProperty("--rail-w", L ? railGeometry().width + "px" : "0px");
  // each tier row is exactly one icon tall, two when it needs a second line; the "…" row gets the rest
  app.style.setProperty("--tile", sz.tier + "px");
  const heights = {};
  for (const t of TIER_IDS) {
    const lines = Math.max(1, Math.ceil(rows[t].length / sz.cols));
    heights[t] = lines * (sz.tier + GAP) - GAP;
    $(`row-${t}`).style.height = heights[t] + "px";
  }
  $("app").style.setProperty("--row-gap", ROW_GAP + "px");

  if (L) {
    const g = railGeometry();
    const origin = app.getBoundingClientRect();
    const stage = $("stage").getBoundingClientRect();
    const first = $(`row-${TIER_IDS[0]}`);
    const top = first.getBoundingClientRect().top - origin.top;
    const left = first.querySelector(".label").getBoundingClientRect().right - origin.left;
    Object.assign($("rail").style, {
      left: stage.right - origin.left - g.width + "px", top: top + "px",
      width: g.width + "px", height: stage.bottom - origin.top - top + "px",
    });
    // positions are computed from the final row heights, so cards don't land mid-animation
    let y = top;
    for (const t of TIER_IDS) {
      placeAt(rows[t], left, y, sz.tier, sz.cols, t);
      y += heights[t] + ROW_GAP;
    }
    placeAt(pool, left, y, sz.pool, sz.pcols, "pool");
  }
  hovers.forEach(placeHover);

  const empty = $("empty");
  empty.hidden = !L || !!(entries.length || pool.length || L.hovering.length);
  empty.innerHTML = `Noch keine Bilder.<br>Lege quadratische Bilder in den Ordner<br>public/images/${screen}/`;
}

// ── a verdict from RankFeed: the grey band briefly turns green or red, then fades back to grey
//    (like the brain screen: green fades fast, red slowly)
const FADE_OUT_MS = 2800, FADE_IN_MS = 1200; // after the mix: to black slowly, back in a bit faster
const BAND_FLASH = { good: { color: "#00ff00", fadeMs: 900 }, bad: { color: "#ff0000", fadeMs: 2500 } };
let bandFlashRun = 0;
function flashBand(vote) {
  const f = BAND_FLASH[vote];
  if (!f) return;
  // the whole background (on the inverted middle screen the opposite color, so it shows green / red)
  if (!$("pod-area").hidden) return; // in the mix only the middle screen flashes, not the top 3 / bottom 3 screens
  const el = $("flash");
  const inverted = document.body.classList.contains("mix-full");
  el.style.background = inverted ? (vote === "good" ? "#ff00ff" : "#00ffff") : f.color;
  el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: f.fadeMs, easing: "ease-out" });
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const from = hex(f.color), to = hex(bg.shade || "#d6d6d6"), run = ++bandFlashRun, t0 = performance.now();
  const r = document.documentElement.style;
  (function step(now) {
    if (run !== bandFlashRun) return; // a newer verdict took over
    const k = Math.min(1, (now - t0) / f.fadeMs), e = 1 - Math.pow(1 - k, 2); // ease-out
    r.setProperty("--shade", `rgb(${from.map((v, i) => Math.round(v + (to[i] - v) * e)).join(",")})`);
    if (k < 1) requestAnimationFrame(step); else r.setProperty("--shade", bg.shade);
  })(t0);
}

// ── hidden icon size slider (press S, or double-click the title). Saved in this browser, per screen.
let userSize = 0;
const sizeKey = () => `rankmania-size-${screen}`;
// ── background settings in the same hidden panel (saved in this browser, for all screens)
const BG_DEFAULT = { up: false, shade: "#666666", band: 18, render: 14, vblur: 0.14, vspread: 0.1 };
let bg = { ...BG_DEFAULT };
try { bg = { ...BG_DEFAULT, ...JSON.parse(localStorage.getItem("rankmania-bg") || "{}") }; } catch {}
function applyBg(save) {
  const r = document.documentElement.style;
  r.setProperty("--shade", bg.shade);
  r.setProperty("--band", bg.band + "%");
  r.setProperty("--render-time", bg.render + "s");
  r.setProperty("--render-dir", bg.up ? "reverse" : "normal");
  $("renderdir").textContent = bg.up ? "↑ bottom to top (click: top to bottom)" : "↓ top to bottom (click: bottom to top)";
  r.setProperty("--vig-blur", bg.vblur);
  r.setProperty("--vig-spread", bg.vspread);
  const px = (k) => Math.round((fixed.tier || 100) * k); // in px at the current icon size
  $("vblur").value = bg.vblur; $("vblurval").textContent = `${bg.vblur.toFixed(2)} (${px(bg.vblur)} px)`;
  $("vspread").value = bg.vspread; $("vspreadval").textContent = `${bg.vspread.toFixed(2)} (${px(bg.vspread)} px)`;
  $("shade").value = bg.shade; $("shadeval").textContent = bg.shade;
  $("band").value = bg.band; $("bandval").textContent = bg.band * 2 + " % of the height";
  $("render").value = bg.render; $("renderval").textContent = bg.render + " s per pass";
  if (save) try { localStorage.setItem("rankmania-bg", JSON.stringify(bg)); } catch {}
}
$("shade").addEventListener("input", () => { bg.shade = $("shade").value; applyBg(true); });
$("band").addEventListener("input", () => { bg.band = +$("band").value; applyBg(true); });
$("renderdir").addEventListener("click", () => { bg.up = !bg.up; applyBg(true); }); // the band runs down or up
$("render").addEventListener("change", () => { bg.render = +$("render").value; applyBg(true); });
$("render").addEventListener("input", () => { $("renderval").textContent = $("render").value + " s per pass"; });
$("vblur").addEventListener("input", () => { bg.vblur = +$("vblur").value; applyBg(true); });
$("vspread").addEventListener("input", () => { bg.vspread = +$("vspread").value; applyBg(true); });
$("bgreset").addEventListener("click", () => { bg = { ...BG_DEFAULT }; applyBg(true); });

function loadSize() {
  try { userSize = +localStorage.getItem(sizeKey()) || 0; } catch { userSize = 0; }
  $("size").value = userSize || fixed.tier || 100;
  $("sizeval").textContent = userSize ? userSize + " px" : "auto";
}
function setSize(v) {
  userSize = v;
  try { v ? localStorage.setItem(sizeKey(), v) : localStorage.removeItem(sizeKey()); } catch {}
  $("sizeval").textContent = v ? v + " px" : "auto";
  fixed.key = ""; // recompute
  layout();
}
function toggleSizer() {
  $("sizer").hidden = !$("sizer").hidden;
  if (!$("sizer").hidden) loadSize();
}
document.addEventListener("keydown", (ev) => {
  if (ev.key === "s" || ev.key === "S") toggleSizer();
  if (ev.key === "Escape") $("sizer").hidden = true;
});
$("title").addEventListener("dblclick", toggleSizer);
$("size").addEventListener("input", () => setSize(+$("size").value));
$("sizeauto").addEventListener("click", () => { setSize(0); $("size").value = fixed.tier; });

// the icon size is chosen once (from how many entries this list has in total) and then kept
let fixed = { key: "" };
applyBg(false); // background and vignette settings saved in this browser
// Chosen once, as big as possible, so that the list always fits on the screen,
// however the entries spread over the tiers (rows grow by a line when a tier is full).
function tileSizes(L) {
  const total = L.entries.length + L.pool.length + L.hovering.length;
  const appW = $("stage").clientWidth, appH = $("stage").clientHeight;
  const label = $(`row-${TIER_IDS[0]}`).querySelector(".label").getBoundingClientRect().width;
  const used = $("title").offsetHeight + ($("mode-switch").offsetParent ? $("mode-switch").offsetHeight : 0)
             + ROW_GAP * (TIER_IDS.length + 1);
  const avail = appH - used;
  const key = [shownId(), total, appW, avail, userSize, TILE_SIZE].join("|");
  if (fixed.key === key) return fixed;
  const colsFor = (s, rail) => Math.max(1, Math.floor((appW - label - rail + GAP) / (s + GAP)));
  const MIN_POOL = 24; // the "…" row never gets thinner than this
  // all entries ranked: six rows plus the extra lines full tiers can need at most, and a thin "…" row
  const fits = (s) => (TIER_IDS.length + Math.floor(total / colsFor(s, s + 16))) * (s + GAP) + MIN_POOL <= avail;
  let tier = userSize || TILE_SIZE;
  if (!tier) {
    tier = Math.floor(avail / (TIER_IDS.length + 1));
    while (tier > 16 && !fits(tier)) tier--;
  }
  // the waiting icons: as big as possible (at most POOL_SCALE of the others) so that all of them
  // fit into the space below six one-line rows at the start
  const poolW = appW - label - (tier + 16);
  const poolSpace = Math.max(MIN_POOL, avail - TIER_IDS.length * (tier + GAP));
  const pool = Math.max(16, Math.min(Math.round(tier * POOL_SCALE), fitSize(poolW, poolSpace, Math.max(1, total))));
  fixed = { key, tier, pool, cols: colsFor(tier, tier + 16), pcols: colsFor(pool, tier + 16) };
  return fixed;
}

// place a row of cards from the left edge of the items area, wrapping into new lines
function placeAt(list, left, top, size, cols, tier) {
  list.forEach((e, i) => {
    if (hovers.has(e.id)) return;
    let c = cards.get(e.id);
    if (!c) {
      c = { el: makeCard(e), shown: tier };
      cards.set(e.id, c);
    }
    c.shown = tier;
    c.el.classList.toggle("in-pool", tier === "pool");
    placeCard(c.el, left + (i % cols) * (size + GAP), top + Math.floor(i / cols) * (size + GAP), size);
    if (c.el.classList.contains("no-anim")) { void c.el.offsetWidth; c.el.classList.remove("no-anim"); }
  });
}

function placeRow(boxId, list, size, tier) {
  if (!list.length) return;
  const origin = $("app").getBoundingClientRect();
  const box = $(boxId).getBoundingClientRect();
  const cols = Math.max(1, Math.floor((box.width + GAP) / (size + GAP)));
  list.forEach((e, i) => {
    if (hovers.has(e.id)) return;
    let c = cards.get(e.id);
    if (!c) {
      c = { el: makeCard(e), shown: tier };
      cards.set(e.id, c);
    }
    c.shown = tier;
    c.el.classList.toggle("in-pool", tier === "pool");
    placeCard(c.el, box.left - origin.left + (i % cols) * (size + GAP),
              box.top - origin.top + Math.floor(i / cols) * (size + GAP), size);
    if (c.el.classList.contains("no-anim")) { void c.el.offsetWidth; c.el.classList.remove("no-anim"); }
  });
}

function makeCard(e) {
  const el = document.createElement("div");
  el.className = "card no-anim";
  el.innerHTML = '<div class="face"><span class="init"></span></div>';
  el.querySelector(".init").textContent = e.title.slice(0, 1);
  if (e.image) {
    const img = document.createElement("img");
    img.src = e.image;
    img.alt = "";
    img.onerror = () => img.remove();
    el.querySelector(".face").append(img);
  }
  // names only for categories with names: true (the students)
  if (e.named) {
    const lines = nameLines(e.title);
    const name = document.createElement("div");
    name.className = "name";
    lines.forEach((l) => { const s = document.createElement("span"); s.textContent = l; name.append(s); });
    el.querySelector(".face").append(name);
    el.dataset.longest = Math.max(...lines.map((l) => l.length));
  }
  $("cards").appendChild(el);
  return el;
}

function placeCard(el, x, y, size) {
  const s = el.style;
  s.width = size + "px";
  s.height = size + "px";
  s.transform = `translate(${x}px,${y}px)`;
  el.dataset.x = x;
  el.dataset.y = y;
  s.setProperty("--s", size + "px"); // the vignette scales with the icon
  const name = el.querySelector(".name");
  if (name) {
    // the name gets as big as possible but always fits on the picture
    const fs = Math.min(size * 0.17, (size * 0.92) / (+el.dataset.longest * 0.54));
    name.style.fontSize = Math.max(5, fs) + "px";
  }
  el.querySelector(".init").style.fontSize = size * 0.4 + "px";
}

const MARK_MS = 2500; // how long the green/red vignette stays after a move
function mark(el, cls) {
  el.classList.remove("mark-up", "mark-down", "mark-new");
  el.classList.add(cls);
  clearTimeout(el._mark);
  el._mark = setTimeout(() => el.classList.remove(cls), MARK_MS);
}

// ════════ Hovering: up and down the track, then into the tier ════════
function startHover(ev) {
  const id = ev.entry.id;
  if (hovers.has(id)) return;
  const L = shown();
  if (L) L.pool = L.pool.filter((p) => p.id !== id);
  // take the picture out of the "…" row if it is there, else make a new one
  let el;
  const c = cards.get(id);
  if (c) { el = c.el; cards.delete(id); el.classList.remove("in-pool"); }
  else el = makeCard(ev.entry);
  el.classList.add("hover");
  const h = { el, slot: ev.slot, start: toLocalTime(ev.startedAt), land: toLocalTime(ev.landAt), score: ev.score, prov: 50, timer: null };
  hovers.set(id, h);
  const step = () => {
    if (hovers.get(id) !== h) return;
    const p = (Date.now() - h.start) / (h.land - h.start);
    if (p >= SETTLE) {
      h.prov = h.score;
      el.classList.add("settled");
    } else {
      // wild at first, calmer towards the end; sometimes it fakes going the other way
      const calm = 1 - p / SETTLE;
      h.prov = clamp(h.score + (Math.random() * 2 - 1) * SWING * calm);
    }
    placeHover(h);
    if (p < SETTLE) Sound.tick(h.prov);
    if (p < 1) h.timer = setTimeout(step, STEP_MS * (0.7 + Math.random() * 0.6));
  };
  if (toLocalTime(ev.startedAt) > Date.now() - 1500) Sound.hoverStart(); // not for ones already hovering when the page opened
  layout();
  step();
}

function placeHover(h) {
  if (!TIER_IDS.length) return;
  const origin = $("app").getBoundingClientRect();
  const rail = $("rail").getBoundingClientRect();
  const { hsize } = railGeometry();
  const band = tierOfScore(h.prov);
  const i = TIER_IDS.indexOf(band);
  const hi = i === 0 ? 100 : tierMins[i - 1];
  const lo = Math.max(1, i === TIER_IDS.length - 1 ? 1 : tierMins[i]);
  const row = $(`row-${band}`).getBoundingClientRect();
  const y = row.top - origin.top + 2 + ((hi - h.prov) / Math.max(1, hi - lo)) * Math.max(0, row.height - hsize - 4);
  const x = rail.left - origin.left + 8 + h.slot * (hsize + 8);
  h.band = band;
  placeCard(h.el, x, y, hsize);
}


// the server says: it landed
function landHover(ev) {
  const id = ev.entry.id;
  const h = hovers.get(id);
  if (h) {
    clearTimeout(h.timer);
    hovers.delete(id);
    h.el.classList.remove("hover", "settled");
    cards.set(id, { el: h.el, shown: ev.entry.tier });
  }
  layout();
  const c = cards.get(id);
  if (!c) return;
  c.el.classList.add("fresh");
  Sound.land();
  mark(c.el, "mark-new");
  setTimeout(() => c.el.classList.remove("fresh"), 1500);
}

// ════════ Clearing between the sequences ════════
// keep = ids that stay standing (at the end of sequence 1: the ones that are printed); they fall after stay ms
function fallOff(keep = [], stay = 0) {
  Sound.clear();
  hovers.forEach((h) => clearTimeout(h.timer));
  const kept = keep.map((id) => cards.get(id)?.el).filter(Boolean);
  const els = [...cards.values(), ...hovers.values()].map((c) => c.el).filter((el) => !kept.includes(el));
  hovers.clear();
  cards.clear();
  const H = window.innerHeight;
  const fall = (els) => {
    els.forEach((el) => {
      el.classList.remove("hover", "settled", "no-anim");
      el.classList.add("falling");
      el.style.transitionDelay = Math.random() * 0.7 + "s";
      const x = +el.dataset.x + (Math.random() * 2 - 1) * 120;
      el.style.transform = `translate(${x}px,${H + 80}px) rotate(${(Math.random() * 2 - 1) * 70}deg)`;
    });
    setTimeout(() => els.forEach((el) => el.remove()), 2000);
  };
  fall(els);
  if (kept.length) setTimeout(() => { Sound.clear(); fall(kept); }, stay);
  $("rail").classList.remove("on");
  $("pool-row").hidden = true;
}

// ════════ Sound effects (made in the browser, no sound files) ════════
// Browsers only allow sound after someone clicks or presses a key once on the page.
// M = mute / unmute (remembered in this browser).
const SOUND_ON = true;  // false = no sound at all
const MUSIC_VOLUME = 0.6; // the music, relative to the sound effects (0 … 1); MUSIC_ON below switches it off
const VOLUME = 0.5;     // 0 … 1
const Sound = (() => {
  let ctx = null, master = null, verb = null, musicBus = null;
  let muted = false;
  try { muted = localStorage.getItem("rankmania-muted") === "1"; } catch {}
  const hint = () => ($("soundhint").hidden = !SOUND_ON || !!ctx || muted);
  function unlock() {
    if (!SOUND_ON || ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(ctx.destination);
      // air: a soft generated reverb that every sound is sent into
      verb = ctx.createConvolver();
      const len = Math.floor(ctx.sampleRate * 2.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.55;
      verb.connect(wet).connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_VOLUME;
      musicBus.connect(master); musicBus.connect(verb);
    } catch { ctx = null; }
    hint();
  }
  ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, unlock, { passive: true }));
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "m" && ev.key !== "M") return;
    muted = !muted;
    try { localStorage.setItem("rankmania-muted", muted ? "1" : "0"); } catch {}
    if (master) master.gain.value = muted ? 0 : VOLUME;
    hint();
  });
  setTimeout(hint, 1500);

  // one tone: frequency (or a slide from f0 to f1), length, loudness, wave shape
  // soft attack, long release, a little into the reverb: airy instead of beepy
  function tone(f0, f1, dur, vol = 0.05, type = "sine", delay = 0, attack = 0.04) {
    if (!ctx || muted) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    if (verb) g.connect(verb);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  // a burst of noise (for the whoosh)
  function noise(dur, vol = 0.25, from = 3000, to = 200) {
    if (!ctx || muted) return;
    const t = ctx.currentTime;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf;
    f.type = "lowpass";
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g);
    g.connect(master);
    if (verb) g.connect(verb);
    src.start(t);
  }
  return {
    // all sine, quiet, soft and with reverb
    hoverStart: () => tone(520, 780, 0.7, 0.04, "sine", 0, 0.12),
    // while undecided: a faint glassy blip, higher for a higher place
    tick: (score) => tone(900 + score * 5, 900 + score * 5, 0.25, 0.012, "sine", 0, 0.02),
    // landing in a tier: a clearer, warm three-note chime (more present than the rest, still soft)
    land: () => { tone(196, 196, 1.4, 0.07, "sine", 0, 0.01); tone(392, 392, 1.3, 0.09, "sine", 0, 0.01);
                  tone(587, 587, 1.5, 0.06, "sine", 0.06, 0.01); tone(1175, 1175, 1.2, 0.02, "sine", 0.06, 0.01); },
    up: () => { tone(660, 660, 0.8, 0.035, "sine"); tone(990, 990, 1.0, 0.03, "sine", 0.12); },
    down: () => { tone(660, 660, 0.8, 0.035, "sine"); tone(440, 440, 1.0, 0.03, "sine", 0.12); },
    clear: () => { noise(2.2, 0.06, 1400, 250); tone(330, 165, 2.0, 0.03, "sine", 0, 0.3); },
    // one note of the music, at a time on the AudioContext clock (soft sine, slow attack, long release)
    note(freq, at, dur, vol, attack = 0.08) {
      if (!ctx || muted || !musicBus) return;
      const t = Math.max(ctx.currentTime, at), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(musicBus);
      o.start(t);
      o.stop(t + dur + 0.05);
    },
    now: () => (ctx ? ctx.currentTime : 0),
    ready: () => !!ctx && !muted,
  };
})();

// ════════ Music ════════
// Minimal, generated in the browser. All three screens share one set of speakers, so only ONE screen plays it
// (MUSIC_SCREEN), with all three voices: low notes, a slow pad and a sparse melody.
// Every phase has its own character: sequence 1 calm (60 bpm), the intermission a rising pulse, the mix twice as fast and tenser.
const MUSIC_ON = true;
const MUSIC_SCREEN = "students"; // the middle screen plays the music; the others stay quiet
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12); // MIDI note → frequency
const PIECES = {
  separate: { beat: 1000, bars: 8, chords: [[45, 52, 55, 59, 60], [41, 48, 52, 57, 60], [48, 55, 59, 64, 67], [43, 50, 52, 59, 62]] },
  mix: { beat: 500, bars: 8, chords: [[45, 52, 55, 59, 60], [46, 53, 57, 60, 62], [41, 48, 52, 55, 59], [40, 47, 50, 56, 59]] },
  intermission: { beat: 900, bars: 4, chords: [[45, 52, 57, 60, 64]] },
};
let musicNext = 0; // the next beat (server time) that is scheduled
function musicPhase() {
  if (inter && Date.now() >= inter.start) return "intermission";
  if (phase === "mix" || holdMix) return "mix";
  if (phase === "separate") return "separate";
  return null; // clearing: silence
}
function musicTick() {
  if (!MUSIC_ON || !Sound.ready()) return;
  const which = musicPhase(), P = which && PIECES[which];
  if (!P) { musicNext = 0; return; }
  if (screen !== MUSIC_SCREEN) return;
  const now = serverNow(), ahead = now + 400; // schedule what falls into the next 0.4 s
  if (!musicNext || musicNext < now - P.beat || musicNext % P.beat) musicNext = Math.ceil(now / P.beat) * P.beat;
  for (; musicNext < ahead; musicNext += P.beat) {
    const b = Math.round(musicNext / P.beat);                 // beat number, the same on every screen
    const chord = P.chords[Math.floor(b / P.bars) % P.chords.length], inBar = b % P.bars;
    const at = Sound.now() + (musicNext - now) / 1000, sec = P.beat / 1000;
    if (which === "intermission") {
      // a slow clock: the pulse (middle) rises with the loading bar, a drone (left), high pings (right)
      const p = inter ? Math.max(0, Math.min(1, (Date.now() - inter.start) / (inter.end - inter.start))) : 0;
      Sound.note(hz(57 + Math.round(p * 12)), at, 0.35, 0.05, 0.005);
      if (inBar === 0) Sound.note(hz(33), at, sec * P.bars, 0.05, 1.5);
      if (h01("i" + b) < 0.35) Sound.note(hz(76 + Math.round(p * 7)), at, 1.6, 0.025, 0.01);
      continue;
    }
    if (inBar === 0 || inBar === P.bars / 2) Sound.note(hz(chord[0] - 12), at, sec * 3.5, 0.08, 0.05);
    if (inBar === 0) chord.slice(1).forEach((m) => Sound.note(hz(m), at, sec * P.bars, 0.022, sec * 1.8));
    if (inBar % (which === "mix" ? 1 : 2) === 0 && h01("m" + b) < (which === "mix" ? 0.55 : 0.6)) {
      Sound.note(hz(chord[1 + Math.floor(h01("n" + b) * 4)] + 12), at, sec * 2.5, 0.035, 0.01);
    }
  }
}
setInterval(musicTick, 150);

// ════════ Live connection ════════
connectDisplay({
  onSnapshot(snap) {
    const first = !TIER_IDS.length;
    TIER_IDS = snap.tiers.map((t) => t.id);
    tierMins = snap.tiers.map((t, i) => (i === snap.tiers.length - 1 ? -Infinity : t.min));
    parallel = snap.parallel || 3;
    const before = shownId();
    phase = snap.phase;
    clearTimeout(blackTimer);
    if (snap.intermission) setTimeout(() => startIntermission(toLocalTime(snap.intermission.startsAt), toLocalTime(snap.intermission.endsAt)));
    else stopIntermission();
    titles = snap.titles || {};
    snap.categories.forEach((c) => {
      lists[c.name] = { label: c.label, title: c.title, source: c.source, virtual: c.virtual,
                        entries: c.entries, pool: c.pool, hovering: c.hovering, votes: c.votes || [] };
    });
    screens = snap.categories.filter((c) => !c.virtual).map((c) => c.name);
    if (first) buildRows();
    buildSwitch();
    const want = screen || ({ konzerne: "corporations", inventions: "things" }[qs.get("cat")] || qs.get("cat")); // old links keep working
    screen = lists[want] && !lists[want].virtual ? want : screens[0];
    try { userSize = +localStorage.getItem(sizeKey()) || 0; } catch { userSize = 0; }
    markSwitch();
    renderMixView(); // inverted / top 3 / bottom 3 at once, not a moment later
    if (first || before !== shownId() || cards.size === 0) rebuild();
    else {
      layout();
      shown()?.hovering.forEach((ev) => toLocalTime(ev.landAt) > Date.now() && startHover(ev));
    }
  },
  onHover(ev) {
    const L = lists[ev.category];
    if (!L) return;
    L.hovering.push(ev);
    L.pool = L.pool.filter((p) => p.id !== ev.entry.id);
    if (ev.category === shownId()) startHover(ev);
  },
  onCommit(ev) {
    const L = lists[ev.category];
    if (ev.replay || !L) return; // the snapshot is already newer than replays
    L.entries = ev.entries;
    L.hovering = L.hovering.filter((h) => h.entry.id !== ev.entry.id);
    if (ev.category === shownId()) landHover(ev);
  },
  onDrift(ev) {
    const L = lists[ev.category];
    if (ev.replay || !L) return;
    L.entries = ev.entries;
    if (ev.category !== shownId()) return;
    layout();
    const c = cards.get(ev.id);
    const moved = ev.after.rank !== ev.before.rank || ev.after.tier !== ev.before.tier;
    if (c && moved) {
      mark(c.el, ev.change > 0 ? "mark-up" : "mark-down");
      ev.change > 0 ? Sound.up() : Sound.down();
    }
  },
  onRoster(ev) {
    const L = lists[ev.category];
    if (!L) return;
    L.entries = ev.entries;
    L.pool = ev.pool;
    if (ev.category === shownId()) layout();
  },
  onPhase(ev) {
    if (!ev.replay && ev.phase !== "clearing") { clearTimeout(blackTimer); stopIntermission(); }
    // after the mix: slowly to black (MIX_FADE_MS on the server), then a bit faster from black into sequence 1
    const fade = $("fade");
    if (!ev.replay && ev.phase === "clearing" && ev.next === "separate" && !ev.intermission) {
      // the mix stays exactly as it is while it fades to black; only in the dark does it clear
      holdMix = true;
      phase = "clearing";
      fade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: FADE_OUT_MS, easing: "ease-in", fill: "forwards" });
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => { holdMix = false; fallOff([], 0); renderMixView(); renderHeader(); }, FADE_OUT_MS);
      return;
    } else if (!ev.replay && ev.phase === "separate" && fade.getAnimations().length) {
      fade.getAnimations().forEach((a) => a.cancel());
      fade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FADE_IN_MS, easing: "ease-out" });
    }
    if (ev.replay || ev.phase !== "clearing") return;
    if (ev.black != null && ev.intermission) { // the intermission after sequence 1
      const start = toLocalTime(ev.t + ev.black);
      startIntermission(start, start + ev.intermission);
    }
    const keep = (ev.keep && ev.keep[shownId()]) || []; // asked before the phase changes (it shows no list while clearing)
    phase = "clearing";
    fallOff(keep, ev.stay || 0);
    renderHeader();
  },
  onVote(ev) {
    const L = lists[ev.category];
    if (!L) return;
    L.votes = ev.votes || [];
    if (ev.category === shownId()) { renderVotes(); if (!ev.replay) flashBand(ev.vote); }
  },
  onTitles(ev) {
    titles = ev.titles || {};
    renderHeader();
  },
  onStatus(s) {
    if (s === "live") renderVotes();
    $("live").textContent = s === "live" ? "LIVE" : s;
    $("live").classList.toggle("on", s === "live");
  },
});

window.addEventListener("resize", layout);

// ── verdict dots from RankFeed, at the bottom of the side strip (newest at the bottom)
function renderVotes() {
  const L = shown();
  const votes = (L && L.votes) || [];
  const el = $("side-votes");
  el.textContent = "";
  votes.slice(-MAX_DOTS).forEach((v) => {
    const d = document.createElement("i");
    d.className = v === "good" ? "good" : "bad";
    d.style.fontStyle = "normal";
    d.textContent = DOT;
    el.append(d);
  });
}
</script>
</body>
