<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rankmania — brain</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body { font: 14px/1.35 Menlo, Monaco, "Courier New", monospace; display: flex; flex-direction: column; overflow: hidden; }
  #bar { background: #fff; color: #000; padding: 2px 8px; white-space: pre; overflow: hidden; flex: 0 0 auto; }
  #log { flex: 1 1 auto; overflow-y: auto; padding: 8px; white-space: pre-wrap; word-break: break-word; }
  .dim { color: #888; }
  .cur::after { content: "█"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* the intermission: a big ASCII face of the brain that smiles and laughs */
  #face { position: fixed; inset: 0; z-index: 5; background: #000; display: grid; place-items: center; }
  #face pre { margin: 0; background: #fff; color: #000; padding: 2vmin 3vmin; font: min(1.55vh, 1.1vw)/1.05 Menlo, Monaco, "Courier New", monospace; }
</style>
</head>
<body>
<div id="bar">rankmania brain — connecting…</div>
<div id="log"></div>
<div id="face" hidden><pre id="face-art"></pre></div>

<script src="shared.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  The brain, as a terminal. Shows every evaluation and recalculation live.
//  The variables are theatre: their names and values are made up (always the same values
//  for the same entity), the scores, tiers and places are the real ones from the server.
// ════════════════════════════════════════════════════════════════
const MAX_LINES = 500;
// flash of the whole screen on a verdict from RankFeed: color, then fade back to black in this many ms
const FLASH = {
  bad: { color: "#ff0000", fadeMs: 7500 },
  good: { color: "#00ff00", fadeMs: 2700 },
};
function flash(vote) {
  const f = FLASH[vote];
  if (!f || !document.body.animate) return;
  document.body.animate([{ backgroundColor: f.color }, { backgroundColor: "#000" }],
                        { duration: f.fadeMs, easing: "ease-out" });
}
// ── the intermission: a laughing ASCII face, drawn from shapes (smile → laugh, mouth opening and closing)
const FACE_W = 62, FACE_H = 34;
function faceFrame(mood, t) {
  const rows = [], shade = "  ..:";
  const bob = Math.sin(t / 260) * (mood === "smile" ? 0.01 : 0.035); // laughing shakes the face a little
  for (let y = 0; y < FACE_H; y++) {
    let row = "";
    for (let x = 0; x < FACE_W; x++) {
      const nx = (x - FACE_W / 2 + 0.5) / (FACE_W / 2), ny = (y - FACE_H / 2 + 0.5) / (FACE_H / 2) - bob;
      const d = Math.hypot(nx, ny);
      let c = " ";
      if (d <= 1) {
        c = d > 0.92 ? "#" : shade[Math.max(0, Math.min(shade.length - 1, Math.round(((nx * 0.5 + ny * 0.5 + 0.4) / 1.4) * (shade.length - 1))))]; // a light shadow bottom right
        // eyes: round when smiling, squeezed into ^ ^ when laughing
        for (const ex of [-0.36, 0.36]) {
          const dx = (nx - ex) / 0.13, dy = (ny + 0.3) / 0.2;
          if (mood === "smile") { if (dx * dx + dy * dy <= 1) c = "@"; }
          else if (Math.abs(dy - (Math.abs(dx) * 0.9 - 0.25)) < 0.28 && Math.abs(dx) < 1.1) c = "@";
        }
        // cheeks
        if (mood !== "smile" && Math.hypot((Math.abs(nx) - 0.62) / 0.13, (ny - 0.12) / 0.1) <= 1) c = "*";
        // mouth: a curved smile, or a wide open laughing mouth (open is 0..1)
        const open = mood === "smile" ? 0 : mood === "laugh1" ? 0.55 : 1;
        const w = mood === "smile" ? 0.5 : 0.6;
        if (Math.abs(nx) < w) {
          const top = 0.18 + 0.12 * (nx / w) ** 2;
          const bottom = top + 0.06 + open * 0.42 * (1 - (nx / w) ** 2);
          if (open === 0) { if (Math.abs(ny - (0.32 - 0.22 * (nx / w) ** 2 + 0.22)) < 0.07) c = "@"; }
          else if (ny >= top && ny <= bottom) c = ny < top + 0.08 ? "=" : ny > bottom - 0.12 && Math.abs(nx) < w * 0.5 ? "o" : "@";
        }
      }
      row += c;
    }
    rows.push(row.replace(/\s+$/, ""));
  }
  return rows.join("\n");
}
let faceTimer = null, faceUntil = 0;
function showFace(start, end) {
  hideFace();
  faceUntil = end;
  const t0 = start;
  const tick = () => {
    const now = Date.now();
    if (now >= faceUntil) return hideFace();
    $face.hidden = now < start;
    const k = (now - t0) % 3200; // 1 s smiling, then laughing: mouth open, half, open, half …
    const mood = k < 1000 ? "smile" : Math.floor(k / 180) % 2 ? "laugh1" : "laugh2";
    $art.textContent = faceFrame(mood, now);
    faceTimer = setTimeout(tick, 90);
  };
  tick();
}
function hideFace() { clearTimeout(faceTimer); faceTimer = null; $face.hidden = true; }
const $face = document.getElementById("face"), $art = document.getElementById("face-art");

const VARS = {
  _any: ["attention_yield", "consensus_drift", "taste_conformity", "click_probability", "outrage_elasticity",
         "cultural_half_life", "nostalgia_coeff", "trust_decay", "virality_index", "aesthetic_entropy",
         "symmetry_bias", "moral_residue", "market_resonance", "meme_potential", "gaze_duration", "legacy_weight"],
  students: ["eye_contact_ratio", "group_chat_latency", "deadline_tolerance", "coffee_dependency", "portfolio_gloss", "laserpointer_grace"],
  things: ["world_change_factor", "patent_aura", "sleep_induction", "grandparent_explainability", "steam_quotient"],
  corporations: ["brand_gravity", "lobby_mass", "logo_symmetry", "apology_frequency", "shareholder_mood", "greenwashing_index"],
};
const TAG = { students: "STU", things: "THG", corporations: "COR" };
// how much is printed: kept low so people in the room can actually read along
const VARS_SHOWN = 3;                     // variables printed per evaluation
const DRIFT_SHOWN = 0.3;                  // share of the small moves that get a line at all
const REEVAL_CHANCE = 0.15;               // share of those shown as a full re-evaluation
const LESSONS_SHOWN = 2;                  // "LEARNED" lines per verdict

const log = document.getElementById("log");
const bar = document.getElementById("bar");
const lists = {};          // list id → entries (for cross-references)
let phase = "separate", speed = 1, started = Date.now(), connected = "connecting", endsAt = null;

// same text → same number between 0 and 1
function h01(s) {
  let x = 2166136261;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
  x ^= x >>> 13; x = Math.imul(x, 0x5bd1e995); x ^= x >>> 15;
  return (x >>> 0) / 4294967296;
}
const pad = (s, n) => (s + " ".repeat(n)).slice(0, n);
const dots = (name, n = 30) => name + " " + ".".repeat(Math.max(2, n - name.length)) + " ";
const clock = () => new Date().toTimeString().slice(0, 8);
const catOf = (list, id) => (list === "mix" ? id.split("/")[0] : list);
const tagOf = (list) => (list === "mix" ? "MIX" : TAG[list] || list).padEnd(7);

function print(text, cls) {
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  document.querySelectorAll(".cur").forEach((n) => n.classList.remove("cur"));
  const line = document.createElement("div");
  line.textContent = text;
  if (cls) line.className = cls;
  line.classList.add("cur");
  log.appendChild(line);
  while (log.children.length > MAX_LINES) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function variablesFor(list, entry) {
  const cat = catOf(list, entry.id);
  const pool = [...VARS._any, ...(VARS[cat] || [])];
  const n = VARS_SHOWN;
  return pool.map((v) => [v, h01(entry.id + v)]).sort((a, b) => a[1] - b[1]).slice(0, n)
    .map(([v]) => ({ name: v, value: h01(v + "|" + entry.id) }));
}

function fmt(v, name) {
  const k = h01(name) * 3;
  if (k < 1) return v.toFixed(4);
  if (k < 2) return (v * 100).toFixed(1) + "%";
  return (v * 1000 - 500).toFixed(2);
}

// ── an entry is evaluated while it hovers on the screen ──
const pending = new Map();
function evaluate(ev) {
  const id = ev.entry.id, list = ev.category;
  const vars = variablesFor(list, ev.entry);
  print("");
  print(`[${clock()}] ${tagOf(list)} EVALUATE  ${ev.entry.title}`);
  const T = tagOf(list);
  const total = Math.max(1000, toLocalTime(ev.landAt) - Date.now());
  const steps = vars.length;
  const timers = [];
  vars.forEach((v, i) => timers.push(setTimeout(() => {
    print(`           ${T}   ${dots(v.name)}${fmt(v.value, v.name)}`);
  }, (total * 0.85 * i) / steps)));
  pending.set(id, timers);
}

function result(ev) {
  (pending.get(ev.entry.id) || []).forEach(clearTimeout);
  pending.delete(ev.entry.id);
  const e = ev.entry, T = tagOf(ev.category);
  print(`[${clock()}] ${T} RESULT    ${e.title} → TIER ${e.tier}   #${e.rank}/${ev.entries ? ev.entries.length : "?"}   committed`);
}

// ── a full re-evaluation of an entry that is already ranked (the same variables, shifted) ──
const busy = new Set();
function reevaluate(ev) {
  const list = ev.category, T = tagOf(list);
  busy.add(list);
  const vars = variablesFor(list, ev.after);
  print("");
  print(`[${clock()}] ${T} REEVALUATE ${ev.after.title}   (was #${ev.before.rank}, tier ${ev.before.tier})`);
  const shift = ev.change / 100;
  const total = 2600 / Math.max(0.25, speed);
  vars.forEach((v, i) => setTimeout(() => {
    const nv = Math.max(0, Math.min(1, v.value + shift * (0.4 + h01(v.name + ev.seq) * 1.2)));
    print(`           ${T}   ${dots(v.name)}${fmt(v.value, v.name)} → ${fmt(nv, v.name)}`);
  }, (total * i) / (vars.length + 1)));
  setTimeout(() => {
    const tier = ev.before.tier === ev.after.tier ? `TIER ${ev.after.tier}` : `TIER ${ev.before.tier}→${ev.after.tier}`;
    print(`[${clock()}] ${T} RESULT    ${ev.after.title} → ${tier}   #${ev.before.rank}→#${ev.after.rank}   score ${ev.before.score}→${ev.after.score}`);
    busy.delete(list);
  }, total);
}

function recalc(ev) {
  if (Math.random() > DRIFT_SHOWN) return; // most small moves happen silently
  if (!busy.has(ev.category) && Math.random() < REEVAL_CHANCE) return reevaluate(ev);
  const cat = catOf(ev.category, ev.id);
  const pool = [...VARS._any, ...(VARS[cat] || [])];
  const v = pool[Math.floor(Math.random() * pool.length)];
  const a = h01(v + "|" + ev.id), b = Math.max(0, Math.min(1, a + ev.change / 100));
  const tier = ev.before.tier === ev.after.tier ? `tier ${ev.after.tier}` : `tier ${ev.before.tier}→${ev.after.tier}`;
  print(`[${clock()}] ${tagOf(ev.category)} RECALC    ${pad(ev.after.title, 26)} ${v} ${a.toFixed(2)}→${b.toFixed(2)}   score ${ev.before.score}→${ev.after.score}   ${tier}   #${ev.before.rank}→#${ev.after.rank}`);
}

function status() {
  const up = Math.floor((Date.now() - started) / 1000);
  const t = `${String(Math.floor(up / 60)).padStart(2, "0")}:${String(up % 60).padStart(2, "0")}`;
  const name = phase === "mix" ? "SEQUENCE 2 · MIX" : phase === "clearing" ? "CLEARING" : "SEQUENCE 1 · SEPARATE";
  const counts = Object.entries(lists).filter(([, v]) => v.length).map(([k, v]) => `${tagOf(k).trim()}:${v.length}`).join(" ");
  let timer = "";
  if (endsAt && phase !== "clearing") {
    const left = Math.max(0, Math.round((endsAt - serverNow()) / 1000));
    timer = `   next sequence in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  }
  bar.textContent = `rankmania brain   ${name}${timer}   speed ${(+speed).toFixed(2)}x   up ${t}   ${counts}   [${connected}]`;
}
setInterval(status, 1000);

connectDisplay({
  onSnapshot(snap) {
    phase = snap.phase;
    if (snap.intermission) showFace(toLocalTime(snap.intermission.startsAt), toLocalTime(snap.intermission.endsAt)); else hideFace();
    snap.categories.forEach((c) => (lists[c.name] = c.entries));
    const active = snap.categories.filter((c) => c.entries.length + c.pool.length + c.hovering.length && (phase === "mix") === !!c.virtual);
    print("rankmania brain — model loaded", "dim");
    print(`phase: ${phase}   lists: ${active.length}   entities: ${active.reduce((n, c) => n + c.entries.length + c.pool.length + c.hovering.length, 0)}`, "dim");
    active.forEach((c) => print(`  ${tagOf(c.name)} ${c.entries.length} ranked, ${c.hovering.length} evaluating, ${c.pool.length} waiting`, "dim"));
    print("question: [REDACTED]   criteria: [REDACTED]", "dim");
    snap.categories.forEach((c) => c.hovering.forEach((hv) => evaluate({ ...hv, category: c.name })));
    fetch(RANK_BASE + "/api/status").then((r) => r.json()).then((s) => { speed = s.speed ?? 1; endsAt = s.phaseEndsAt; }).catch(() => {});
    status();
  },
  onHover: evaluate,
  onCommit(ev) {
    if (ev.replay) return;
    lists[ev.category] = ev.entries;
    result(ev);
  },
  onDrift(ev) {
    if (ev.replay) return;
    lists[ev.category] = ev.entries;
    recalc(ev);
  },
  onVote(ev) {
    flash(ev.vote);
    const good = (ev.votes || []).filter((v) => v === "good").length;
    const bad = (ev.votes || []).length - good;
    const T = tagOf(ev.category);
    print(`[${clock()}] ${T} FEEDBACK  verdict "${ev.vote}"   good ${good} · bad ${bad}   weight ${(0.15).toFixed(3)}   mood ${ev.mood >= 0 ? "+" : ""}${ev.mood.toFixed(2)}`);
    for (const l of (ev.lessons || []).slice(0, LESSONS_SHOWN)) {
      const sg = (v) => (v >= 0 ? "+" : "") + v.toFixed(2);
      print(`           ${T} LEARNED  ${l.title.padEnd(26).slice(0, 26)} ${sg(l.delta)}   bias ${sg(l.bias)}   (${l.verdicts} verdict${l.verdicts === 1 ? "" : "s"})`);
    }
  },
  onRoster(ev) {
    lists[ev.category] = ev.entries;
    print(`[${clock()}] ${tagOf(ev.category)} FOLDER CHANGE  ${ev.entries.length} ranked, ${ev.waiting} waiting`, "dim");
  },
  onPhase(ev) {
    if (ev.replay) return;
    if (ev.phase === "clearing" && ev.black != null && ev.intermission) {
      const start = toLocalTime(ev.t + ev.black);
      showFace(start, start + ev.intermission);
      print(`[${clock()}] ======== INTERMISSION: ANALYZING · MEDIATING · PREPARING PRINT ========`);
    } else if (ev.phase !== "clearing") hideFace();
    pending.forEach((t) => t.forEach(clearTimeout));
    pending.clear();
    print("");
    if (ev.phase === "clearing") {
      phase = "clearing";
      print(`[${clock()}] ======== PURGE: ALL RANKINGS DELETED ========`);
    } else {
      phase = ev.phase;
      print(`[${clock()}] ======== ${ev.phase === "mix" ? "SEQUENCE 2 · MIX: 20 ENTITIES FROM ALL LISTS, ONE RANKING" : "SEQUENCE 1 · SEPARATE: NEW ROUND"} ========`);
    }
    status();
  },
  onStatus(s) { connected = s; status(); },
});

// keep the speed in the status bar up to date
setInterval(() => fetch(RANK_BASE + "/api/status").then((r) => r.json()).then((s) => { speed = s.speed ?? speed; endsAt = s.phaseEndsAt; }).catch(() => {}), 5000);
</script>
</body>
</html>
