<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rankmania</title>
</head>
<body>
<h1>Rankmania</h1>
<h2>Ranking screens (one per category)</h2>
<ul id="screens"></ul>
<h2>For visitors' phones</h2>
<ul><li><a href="feed.html">RankFeed</a> (a personal snapshot with three articles)</li></ul>
<h2>For you</h2>
<ul><li><a href="admin.html">Show control</a> (switch between sequence 1 and 2, brain speed)</li>
<li><a href="brain.html">Brain</a> (the terminal view of the brain)</li></ul>
<h2>Images</h2>
<p id="counts">loading…</p>
<script>
fetch("api/state").then(r => r.json()).then(s => {
  const cats = s.categories.filter(c => !c.virtual);
  document.getElementById("screens").innerHTML = cats.map(c =>
    `<li><a href="ranking.html?cat=${c.name}&kiosk=1">${c.label}</a></li>`).join("") +
    `<li><a href="ranking.html">All categories with switch</a></li>`;
  document.getElementById("counts").innerHTML = cats.map(c =>
    `${c.label}: ${c.entries.length + c.pool.length + c.hovering.length} images in public/images/${c.name}/`).join("<br>");
}).catch(() => document.getElementById("counts").textContent = "server not reachable");
</script>
</body>
</html>
