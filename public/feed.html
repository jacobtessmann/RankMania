<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RankFeed</title>
<style>
  :root { --red: #ee3322; --yellow: #ffee00; --ink: #222; --grey: #757575; --line: #e8e8e8; --soft: #f6f6f6;
          --tier-S: #ff7f7f; --tier-A: #ffff7f; --tier-B: #7fff7f; --tier-C: #7fffff; --tier-D: #ff7fff; --tier-F: #9b30ff; }
  * { box-sizing: border-box; }
  @font-face { font-family: "CMU Typewriter Light"; src: url("fonts/cmunbtl.woff") format("woff"); font-weight: normal; font-style: normal; font-display: swap; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "CMU Typewriter Light", "Courier New", monospace;
         -webkit-font-smoothing: antialiased; }
  /* everything in CMU Typewriter Light: no bold anywhere, the hierarchy is size only */
  h1, h2, h3, b, strong, .logo, .poll button { font-weight: normal; }
  button { font: inherit; }
  .mast { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line);
          display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
          padding: 12px 18px; padding-top: max(12px, env(safe-area-inset-top)); }
  .asof { text-align: center; font-size: 11px; line-height: 1.3; letter-spacing: .08em; color: var(--grey); text-transform: uppercase; }
  .logo { font-size: 30px; font-weight: normal; letter-spacing: -.5px; color: var(--red); text-decoration: none; }
  /* C, P, T: jump to capital, people, things (in the mix, each opens one part of "everything") */
  .badges { display: flex; gap: 6px; }
  .bdg { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; text-decoration: none;
         font-size: 15px; font-weight: normal; color: #fff; background: var(--red); }
  main { max-width: 680px; margin: 0 auto; padding: 0 18px 40px; }
  .edition { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; padding: 18px 0 6px; margin: 0; }
  .note { font-size: 15px; line-height: 1.45; margin: 0 0 8px; }

  /* thumbnail: one red word in a red frame (PEOPLE, THINGS, CAPITAL, EVERYTHING) */
  .thumb { aspect-ratio: 16 / 10; display: grid; place-items: center; background: #fff; border: 3px solid var(--red);
           container-type: inline-size; overflow: hidden; }
  .thumb span { color: var(--red); font-size: 12cqw;
                line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }

  /* home */
  .card { display: block; padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .card .thumb { margin-bottom: 12px; }
  .card h2 { margin: 14px 0 8px; font-size: 38px; line-height: 1.12; }
  .card .sub { margin: 0; font-size: 22px; color: var(--red); line-height: 1.3; }

  /* article */
  .back { display: inline-block; margin: 16px 0 4px; color: var(--grey); text-decoration: none; font-size: 14px; }
  .article h1 { margin: 8px 0 10px; font-size: 46px; line-height: 1.08; }
  .article .deck { font-size: 26px; line-height: 1.25; color: var(--red); margin: 0 0 8px; }
  .article .deck2 { font-size: 15px; line-height: 1.4; color: var(--grey); margin: 0 0 12px; }
  .body p { font-size: 19px; line-height: 1.5; margin: 18px 0; color: #000; }
  .body h2 { font-size: 24px; font-weight: normal; letter-spacing: -.3px; margin: 30px 0 6px; }
  .box { background: var(--soft); padding: 14px 16px; margin: 22px 0; font-size: 15px; line-height: 1.5; }
  .box b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .box table { border-collapse: collapse; width: 100%; }
  .box td { padding: 3px 0; border-top: 1px solid #e2e2e2; }
  .box td:last-child { text-align: right; font-weight: normal; }
  .redact { background: #111; color: #111; padding: 0 .2em; user-select: none; }

  /* entries, grouped by tier under a big colored block (like the sketch) */
  .tierhead { aspect-ratio: 2.4 / 1; background: var(--c); display: grid; place-items: center; margin: 34px 0 6px;
              container-type: inline-size; }
  .tierhead span { font-size: 13cqw; line-height: 1; color: #000; }
  .tierhead[data-t="F"] span { color: #fff; }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { padding: 18px 0 22px; }
  .entry + .entry { border-top: 1px solid var(--ink); }
  .entry .pic { position: relative; border: 3px solid var(--red); margin-bottom: 12px; container-type: inline-size; }
  .entry .pic img, .entry .pic .ph { background: #fff; display: block; object-fit: contain; width: 100%; aspect-ratio: 1; border: 0; }
  /* static white vignette, scaled like on the screens (blur .14, spread .1 of the picture size) */
  .entry .pic.vig::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 14cqw 10cqw #fff; }
  .entry h3 { margin: 0 0 10px; font-size: 32px; line-height: 1.1; font-weight: normal; color: #000; }
  .entry .hook { margin: 0; font-size: 16px; line-height: 1.5; color: #000; }
  .review { margin: 12px 0 0; font-size: 17px; line-height: 1.45; color: #000; }
  .review .lbl { color: var(--red); }
  .review .src { display: block; margin-top: 6px; font-size: 14px; color: #000; }
  .tier { display: inline-block; min-width: 22px; text-align: center; font-weight: normal; font-size: 12px; padding: 2px 5px;
          margin-right: 8px; vertical-align: .35em; background: var(--c); color: #000; }
  .tier[data-t="F"] { color: #fff; }

  /* the vote: fixed at the bottom of the screen in an article (like the sketch), press as often as you like */
  .votebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding-bottom: env(safe-area-inset-bottom); background: #000; }
  .vote-msg { margin: 0; padding: 9px 12px 10px; background: #000; color: #fff; text-align: center; font-size: 16px; line-height: 1.3; }
  .votebar .row2 { display: grid; grid-template-columns: 1fr 1fr; }
  .votebar button { height: 64px; border: 0; cursor: pointer; font-size: 22px; color: #000; -webkit-tap-highlight-color: transparent; }
  .votebar .good { background: #77ff55; }
  .votebar .bad { background: var(--red); color: #fff; }
  .votebar button.hit { animation: hit .25s ease-out; }
  @keyframes hit { 0% { filter: brightness(1.6); } 100% { filter: none; } }
  body.with-vote main { padding-bottom: 140px; }
  .related { margin-top: 34px; }
  .related h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--grey); margin: 0 0 4px; }
  .related .card { display: grid; grid-template-columns: 40% 1fr; gap: 12px; align-items: stretch; padding: 14px 0; }
  .related .card .thumb { margin: 0; border-width: 2px; aspect-ratio: auto; height: 100%; min-height: 90px; } /* as tall as the text next to it */
  .related .card h2 { font-size: 18px; line-height: 1.15; color: var(--ink); text-transform: none; margin: 0 0 6px; }
  .related .card .sub { font-size: 16px; }
  /* the three sources, at the bottom of every page */
  .sources { margin: 30px 0 0; padding: 14px 0 0; border-top: 1px solid var(--ink); font-size: 15px; line-height: 1.5; }
  .sources p { margin: 0 0 6px; color: var(--red); }
  .sources a { display: block; color: #000; word-break: break-all; }
  .end { margin-top: 30px; padding-top: 16px; border-top: 4px solid var(--ink); font-size: 15px; line-height: 1.5; }

  /* one entry */
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: center; padding: 16px; }
  .sheet[hidden] { display: none; }
  .panel { background: #fff; width: 100%; max-width: 340px; margin: 0 auto; max-height: 86vh; overflow: auto;
           padding: 16px 16px 10px; border-radius: 14px; }
  .panel img, .panel .ph { width: 62%; margin: 0 auto; aspect-ratio: 1; object-fit: contain; background: #f2f2f2; display: block; }
  .panel h2 { margin: 12px 0 4px; font-size: 22px; font-weight: normal; letter-spacing: -.3px; }
  .panel .meta { font-size: 14px; margin-bottom: 6px; }
  .panel p { font-size: 14px; line-height: 1.4; margin: 0 0 12px; }
  .close { width: 100%; padding: 12px; border: 0; background: none; color: var(--grey); margin-top: 6px; cursor: pointer; }
  .ph { display: grid; place-items: center; font-size: 40px; font-weight: normal; color: #bbb; }
</style>
</head>
<body>
<div class="mast">
  <a class="logo" href="#">RankFeed</a>
  <div class="asof" id="asof"></div>
  <nav class="badges"><a class="bdg" href="#/corporations" title="Capital">C</a><a class="bdg" href="#/students" title="People">P</a><a class="bdg" href="#/things" title="Things">T</a></nav>
</div>
<main id="view"><p class="edition">Loading your edition…</p></main>
<!-- the vote: fixed at the bottom while an article is open; can be pressed as often as you like -->
<div class="votebar" id="votebar" hidden>
  <p class="vote-msg" id="vote-msg"></p>
  <div class="row2"><button type="button" class="good" data-vote="good" aria-label="Good"></button><button type="button" class="bad" data-vote="bad" aria-label="Bad"></button></div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>

<script src="shared.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  RankFeed — a personal snapshot
//  The moment someone opens this page, it loads the ranking ONCE and writes three
//  articles for this visitor only (one per category). It never changes afterwards.
//  Reloading in the same browser tab keeps the same edition.
// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════
//  THE TEXTS. All of it stays in character: a BuzzFeed writer who takes the ranking completely
//  seriously and dramatizes every placement. Nothing explains or hints at the project.
// ════════════════════════════════════════════════════════════════

    ],

};

// ── The intro: one short paragraph, picked at random per category
const INTRO = {

    "Every boardroom on this list is refreshing this page right now. Some of them are celebrating. Most of them are not.",

    "One list. Every category. Zero mercy.",
  ],
};

// ── Under every entry: drama about its placement, by tier. Many lines per tier, so nothing repeats in one article.
const DRAMA = {
  S: [
    "Untouchable. There is genuinely no debate here.",
    "Main character energy, and honestly? Earned.",
    "The moment we saw this one, the decision was already made.",
    "Iconic. Legendary. Moving on before we get emotional.",
    "Everyone else on this list is quietly fighting for second place.",
    "This is what peak looks like. Take notes.",
    "Not even close. Not. Even. Close.",
    "Crowned, framed and hung in the hall of fame.",
  ],
  A: [
    "So close to the top you can almost taste it.",
    "Elite, just not quite legendary. Yet.",
    "A strong showing, and everyone knows it.",
    "One small step away from greatness. Painful, but beautiful.",
    "Walked in like it owned the place, and almost did.",

    "We went back and forth on this one for a long time.",
    "Perfectly average, and somehow that stings.",
    "It had potential. We all saw it. And then this.",
    "Middle of the pack, glancing nervously at the bottom.",
    "A shrug, but make it a ranking.",
  ],
  D: [
    "This one hurts a little to look at.",
    "Oof. We really wanted this to go differently.",
    "Somewhere, someone is very upset about this placement.",
    "Not the bottom. But you can see it from here.",
    "Let's just say the comeback story starts now.",
    "A rough day at the office. A rough year, really.",
    "We're not saying it's bad. We're just not saying it's good.",
    "Close your eyes and keep scrolling. We'll wait.",
  ],
  F: [
    "We're so sorry. Truly.",
    "There's no nice way to say this, so we won't.",
    "The bottom. The very, very bottom.",
    "Somebody had to be here, and it was always going to be this.",
    "Rest in peace to this one's reputation.",
    "Let's have a moment of silence. Okay, that's enough.",
    "Not a placement. A cry for help.",
    "Unfortunately, the people have spoken.",
  ],
};

// ── One line after the first tier group
const MIDDLES = [
  "Halfway down, and it only gets more brutal from here.",
  "Still with us? Good. The next part is where it gets painful.",
  "Deep breath. The bottom half is not for the faint of heart.",
];

// the source links at the bottom of an article (the mix: all three)
const SOURCE_LINKS = {
  corporations: "https://www.forbes.com/lists/global2000/",
  students: "https://visualcommunication.zhdk.ch/personen/bachelor/",
  things: "https://www.listchallenges.com/top-100-greatest-things-ever",
};
const sourceFooter = (slug) => {
  const urls = slug === "everything" ? Object.values(SOURCE_LINKS) : [SOURCE_LINKS[slug]].filter(Boolean);
  return urls.length ? `<footer class="sources"><p>Source${urls.length > 1 ? "s" : ""}</p>${urls.map((u) =>
    `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https:\/\/(www\.)?/, "").replace(/\/$/, "")}</a>`).join("")}</footer>` : "";
};
// The verdict at the end of each article: the visitor rates the whole list. It really goes to the brain
// (one green or red dot on that screen, a flash on the brain screen, and a tiny shift in the ranking).
const VERDICT = {
  title: "How is this ranking? Calibrate the machine.",
  thanksGood: "Good. The machine adjusts. 💚",
  thanksBad: "Bad. The machine adjusts. 💔",
  tooFast: "Slow down a little.",
  offline: "The machine can't be reached right now.",
};

const EXPOSED = {

  "Amazon": { text: "Admitted that its delivery drivers sometimes have to pee in bottles to keep up. The schedule matters more than a toilet.",

  "Apple": { text: "After a wave of worker suicides in 2010, the factory building its iPhones put up nets around its dormitories. The phones kept shipping.",
    src: "NBC Bay Area, 2010", url: "https://www.nbcbayarea.com/news/local/apple-sends-tim-cook-to-china-encourages-suicide-nets-at-foxconn-report/1909166/?amp=1" },
  "AstraZeneca": { text: "When its blockbuster ulcer pill lost its patent, it relaunched half of the very same molecule as a \"new\" purple pill and made billions more.",

  "Bayer": { text: "In the 1980s its blood-products unit kept selling an HIV-risky medicine in Asia and Latin America while a safer one was on sale in the US and Europe.",
    src: "Al Jazeera / New York Times, May 2003", url: "https://www.aljazeera.com/news/2003/5/22/high-risk-drug-sold-alongside-safer-version" },
  "BlackRock": { text: "Its software Aladdin oversees more than $20 trillion in assets, roughly what the entire US economy produces in a year.",
    src: "Wikipedia: Aladdin (BlackRock)", url: "https://en.wikipedia.org/wiki/Aladdin_(BlackRock)" },
  "Disney": { text: "Argued that a widower couldn't sue over his wife's death after a meal at Disney World because he had once signed up for a Disney+ free trial. It backed down after the outcry.",
    src: "NBC News, Aug 2024", url: "https://www.nbcnews.com/news/us-news/disney-says-man-cant-sue-wifes-death-agreed-disney-terms-service-rcna166594" },

    src: "BBC, Oct 2012", url: "https://bbc.in/ShG5Na" },
  "Uber": { text: "Built a secret tool called \"Greyball\" that showed fake cars to officials trying to catch it breaking the rules.",
    src: "Engadget, Mar 2017", url: "https://www.engadget.com/2017-03-03-uber-used-greyball-tool-to-evade-authorities-around-the-world.html" },
  "UBS": { text: "In 1997 a night guard caught the bank shredding records from the Holocaust era. He had to leave Switzerland; the bank stayed.",
    src: "Swissinfo", url: "https://www.swissinfo.ch/eng/christoph-meili-returns---as-hero-or-villain-/7330344" },
};

const $ = (id) => document.getElementById(id);
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffled = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
let edition = null;

// ════════ Write the edition (once) ════════
function writeEdition(snap) {
  const ORDER = ["corporations", "students", "things"]; // the order of the articles: capital, people, things
  const rank = (c) => (ORDER.indexOf(c.name) + 1) || 99;
  const mixed = snap.phase === "mix";
  // three articles (capital, people, things), or in the mix ONE article about the shared list
  const groups = mixed ? snap.categories.filter((c) => c.name === "mix")
                       : snap.categories.filter((c) => !c.virtual).sort((x, y) => rank(x) - rank(y));
  const articles = groups.map((c, i) => {
    const L = c;
    const key = mixed ? "mix" : c.name;
    const T = TEASERS[key] || TEASERS.mix;
    const entries = (L.entries || []).map((e) => ({ id: e.id, title: e.title, image: e.image, tier: e.tier, rank: e.rank }));
    const n = entries.length;
    const left = {}; // per tier: the drama lines not used yet in this article
    entries.forEach((e) => {
      const pool = (left[e.tier] = left[e.tier] && left[e.tier].length ? left[e.tier] : shuffled(DRAMA[e.tier] || DRAMA.C));
      e.line = pool.shift();
      e.fact = EXPOSED[e.title] || null; // every corporation gets its receipt
    });
    const v = { n, part: i + 1, label: mixed ? "people, things and capital" : c.label.toLowerCase(),
                top: entries[0]?.title, last: entries[n - 1]?.title };
    return {
      slug: mixed ? "everything" : c.name,
      list: c.name, // the list on the screens, for the verdict
      cat: mixed ? "Everything" : c.label,
      head: screenTitle(snap, mixed ? "students" : c.name, n) || fill(T.head, v), // the same headline as on the screen
      title: fill(pick(T.titles), v),
      word: T.word,
      intros: [fill(pick(INTRO[key] || INTRO.mix), v)],
      middle: fill(pick(MIDDLES), v),
      vars: 9 + Math.floor(Math.random() * 30),
      ready: n >= 2,
      entries,
    };
  });
  return { at: Date.now(), mixed, articles };
}

// the headline the tierlist screen shows right now ({n} = number of entries); in the mix the middle screen's
function screenTitle(snap, screen, n) {
  const t = (snap.titles || {})[screen];
  return t ? t.replace(/\{n\}/g, n) : "";
}

// ════════ Pieces ════════
const timeOf = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); // always 24h, e.g. 13:39
const img = (e, cls = "") => e.image
  ? `<img class="${cls}" src="${esc(e.image)}" alt="${esc(e.title)}" loading="lazy">`
  : `<div class="ph ${cls}">${esc(e.title[0])}</div>`;
const tierChip = (t) => `<span class="tier" data-t="${t}" style="--c:var(--tier-${t})">${t}</span>`;
const thumb = (a) => `<div class="thumb"><span>${esc(a.word)}</span></div>`;
const teaser = (a, cls = "card") => `
  <a class="${cls}" href="#/${a.slug}">
    ${thumb(a)}
    <div>
      <h2>${esc(a.head)}</h2><p class="sub">${esc(a.title)}</p></div>
  </a>`;
// one entry: place, name as its headline, picture, the one-liner, and (Corporations) the critical review.
// big = the top 3 (picture full width), otherwise a compact row (number, small picture, text)
const review = (e) => e.fact ? `
    <p class="review"><span class="lbl">The receipts:</span> ${esc(e.fact.text)}
      <a class="src" href="${esc(e.fact.url)}" target="_blank" rel="noopener">Source: ${esc(e.fact.src)}</a></p>` : "";
// one entry: the name, the picture, the one-liner and (corporations) the critical review. No numbers.
// VIGNETTE: the same soft white inner edge as on the tierlist screens (false = plain pictures)
const VIGNETTE = true;
const entry = (e) => `
  <li class="entry" data-id="${esc(e.id)}">
    <div class="pic${VIGNETTE ? " vig" : ""}">${img(e)}</div>
    <h3>${esc(e.title)}</h3>
    <p class="hook">${esc(e.line)}</p>
    ${review(e)}
  </li>`;
// the entries grouped by tier, each group under a big colored "A-TIER" block
const TIER_ORDER = ["S", "A", "B", "C", "D", "F"];
const tierBlock = (t) => `<div class="tierhead" data-t="${t}" style="--c:var(--tier-${t})"><span>${t}-TIER</span></div>`;
const byTier = (entries) => TIER_ORDER.map((t) => [t, entries.filter((e) => e.tier === t)]).filter(([, l]) => l.length);

// ════════ Views ════════
function home() {
  delete $("view").dataset.slug;
  hideVote();
  const ready = edition.articles.filter((a) => a.ready);
  $("view").innerHTML = `
    ${ready.map((a) => teaser(a)).join("")}
    ${ready.length ? "" : `<p class="note">Still ranking. Come back in a minute for your edition.</p>`}`;
  window.scrollTo(0, 0);
}

function article(slug) {
  const a = edition.articles.find((x) => x.slug === slug);
  if (!a || !a.ready) return home();
  $("view").dataset.slug = slug;
  const groups = byTier(a.entries);
  const others = edition.articles.filter((x) => x.slug !== slug && x.ready);
  $("view").innerHTML = `
    <div class="article">
      <a class="back" href="#">← All articles</a>
      <h1>${esc(a.head)}</h1>
      <p class="deck">${esc(a.title)}</p>
      <div class="body">
        ${a.intros.map((p) => `<p>${esc(p)}</p>`).join("")}
        ${groups.map(([t, list], gi) => `
          ${gi === 1 ? `<p>${esc(a.middle)}</p>` : ""}
          ${tierBlock(t)}
          <ol class="entries">${list.map(entry).join("")}</ol>`).join("")}
        ${others.length ? `<div class="related"><h2>You might also be ranked in</h2>${others.map((o) => teaser(o, "card")).join("")}</div>` : ""}
        ${sourceFooter(slug)}
      </div>
    </div>`;
  setupVerdict(a);
  window.scrollTo(0, 0);
}

function sheet(slug, id) {
  const a = edition.articles.find((x) => x.slug === slug);
  const e = a && a.entries.find((x) => x.id === id);
  if (!e) return;
  $("panel").innerHTML = `
    ${img(e)}
    <h2>${esc(e.title)}</h2>
    <div class="meta">${tierChip(e.tier)}${esc(a.cat)}</div>
    <button class="close" id="close">Close</button>`;
  $("sheet").hidden = false;
  $("close").onclick = () => history.back();
}

// ════════ The verdict: one vote per article, sent to the brain ════════
function setupVerdict(a) {
  const bar = $("votebar"), msg = $("vote-msg"), count = { good: 0, bad: 0 };
  let reset = null;
  const say = (t, ms) => {
    msg.textContent = t;
    clearTimeout(reset);
    if (ms) reset = setTimeout(() => (msg.textContent = VERDICT.title), ms);
  };
  say(VERDICT.title);
  bar.hidden = false;
  document.body.classList.add("with-vote");
  bar.querySelectorAll("[data-vote]").forEach((b) => {
    b.textContent = "";
    b.onclick = async () => {
      const vote = b.dataset.vote;
      b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit"); // a little pop on every press
      try {
        const r = await fetch(RANK_BASE + "/api/vote", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ list: a.list, vote, order: a.entries.map((e) => e.image) }), // the voter's list, best first
        });
        if (r.status === 429) return say(VERDICT.tooFast, 1200);
        if (!r.ok) throw new Error();
        count[vote]++;
        b.textContent = "+" + count[vote];
        say(vote === "good" ? VERDICT.thanksGood : VERDICT.thanksBad, 1600);
      } catch {
        say(VERDICT.offline, 2000);
      }
    };
  });
}
function hideVote() {
  $("votebar").hidden = true;
  document.body.classList.remove("with-vote");
}

// ════════ Routing: #/students and #/students/<entry id> ════════
function route() {
  if (!edition) return;
  const [, slug, id] = location.hash.split("/");
  if (!slug) { $("sheet").hidden = true; return home(); }
  if ($("view").dataset.slug !== slug) article(slug);
  if (id) sheet(slug, decodeURIComponent(id));
  else $("sheet").hidden = true;
}
window.addEventListener("hashchange", route);
$("sheet").addEventListener("click", (ev) => { if (ev.target === $("sheet")) history.back(); });

// ════════ Start: load once, write once ════════
(async function start() {
  // every page load (also a manual refresh) writes a new edition from the ranking at that moment
  try {
    edition = writeEdition(await fetchRankState());
    $("asof").innerHTML = `Rankings from<br>${timeOf(edition.at)}`;
    // in the mix there is only one article: C, P and T all lead to it
    if (edition.mixed) document.querySelector(".badges").innerHTML = '<a class="bdg" href="#/everything" title="Everything">E</a>'; // the mix: one article
  } catch {
    $("view").innerHTML = `<p class="edition">Offline</p><p class="note">The ranking can't be reached right now. Try again in a moment.</p>`;
    return;
  }
  route();
})();
</script>
</body>
