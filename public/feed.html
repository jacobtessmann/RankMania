<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RankFeed</title>
<style>
  :root { --red: #ee3322; --yellow: #ffee00; --ink: #222; --grey: #757575; --line: #e8e8e8; --soft: #f6f6f6;
          --tier-S: #ff7f7f; --tier-A: #ffff7f; --tier-B: #7fff7f; --tier-C: #7fffff; --tier-D: #ff7fff; --tier-F: #9b30ff; }
  * { box-sizing: border-box; }
  @font-face { font-family: "CMU Typewriter Light"; src: url("fonts/cmunbtl.woff") format("woff"); font-weight: normal; font-style: normal; font-display: swap; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: "CMU Typewriter Light", "Courier New", monospace;
         -webkit-font-smoothing: antialiased; }
  /* everything in CMU Typewriter Light: no bold anywhere, the hierarchy is size only */
  h1, h2, h3, b, strong, .logo, .poll button { font-weight: normal; }
  button { font: inherit; }
  .mast { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line);
          display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
          padding: 12px 18px; padding-top: max(12px, env(safe-area-inset-top)); }
  .asof { text-align: center; font-size: 11px; line-height: 1.3; letter-spacing: .08em; color: var(--grey); text-transform: uppercase; }
  .logo { font-size: 30px; font-weight: normal; letter-spacing: -.5px; color: var(--red); text-decoration: none; }
  /* C, P, T: jump to capital, people, things (in the mix, each opens one part of "everything") */
  .badges { display: flex; gap: 6px; }
  .bdg { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; text-decoration: none;
         font-size: 15px; font-weight: normal; color: #fff; background: var(--red); }
  main { max-width: 680px; margin: 0 auto; padding: 0 18px 40px; }
  .edition { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: 1px; padding: 18px 0 6px; margin: 0; }
  .note { font-size: 15px; line-height: 1.45; margin: 0 0 8px; }

  /* thumbnail: one red word in a red frame (PEOPLE, THINGS, CAPITAL, EVERYTHING) */
  .thumb { aspect-ratio: 16 / 10; display: grid; place-items: center; background: #fff; border: 3px solid var(--red);
           container-type: inline-size; overflow: hidden; }
  .thumb span { color: var(--red); font-size: 12cqw;
                line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }

  /* home */
  .card { display: block; padding: 20px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .card .thumb { margin-bottom: 12px; }
  .card h2 { margin: 14px 0 8px; font-size: 30px; line-height: 1.12; }
  .card .sub { margin: 0; font-size: 22px; color: var(--red); line-height: 1.3; }

  /* article */
  .back { display: inline-block; margin: 16px 0 4px; color: var(--grey); text-decoration: none; font-size: 14px; }
  .article h1 { margin: 8px 0 10px; font-size: 36px; line-height: 1.08; }
  .article .deck { font-size: 26px; line-height: 1.25; color: var(--red); margin: 0 0 8px; }
  .article .deck2 { font-size: 15px; line-height: 1.4; color: var(--grey); margin: 0 0 12px; }
  .body p { font-size: 19px; line-height: 1.5; margin: 18px 0; color: #000; }
  .body h2 { font-size: 24px; font-weight: normal; letter-spacing: -.3px; margin: 30px 0 6px; }
  .box { background: var(--soft); padding: 14px 16px; margin: 22px 0; font-size: 15px; line-height: 1.5; }
  .box b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .box table { border-collapse: collapse; width: 100%; }
  .box td { padding: 3px 0; border-top: 1px solid #e2e2e2; }
  .box td:last-child { text-align: right; font-weight: normal; }
  .redact { background: #111; color: #111; padding: 0 .2em; user-select: none; }

  /* entries, grouped by tier under a big colored block (like the sketch) */
  .tierhead { aspect-ratio: 2.4 / 1; background: var(--c); display: grid; place-items: center; margin: 34px 0 6px;
              container-type: inline-size; }
  .tierhead span { font-size: 13cqw; line-height: 1; color: #000; }
  .tierhead[data-t="F"] span { color: #fff; }
  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { cursor: pointer; padding: 18px 0 22px; }
  .entry + .entry { border-top: 1px solid var(--ink); }
  .entry img, .entry .ph { border: 3px solid var(--red); background: #fff; display: block; object-fit: contain;
                           width: 100%; aspect-ratio: 1; margin-bottom: 12px; }
  .entry h3 { margin: 0 0 12px; font-size: 24px; line-height: 1.15; font-weight: normal; color: #000; }
  .entry .hook { margin: 0; font-size: 16px; line-height: 1.5; color: #000; }
  .review { margin: 12px 0 0; font-size: 17px; line-height: 1.45; color: #000; }
  .review .lbl { color: var(--red); }
  .review .src { display: block; margin-top: 6px; font-size: 14px; color: #000; }
  .tier { display: inline-block; min-width: 22px; text-align: center; font-weight: normal; font-size: 12px; padding: 2px 5px;
          margin-right: 8px; vertical-align: .35em; background: var(--c); color: #000; }
  .tier[data-t="F"] { color: #fff; }

  /* the vote: big, loud, impossible to miss (full width of the phone) */
  .poll { margin: 34px -18px; padding: 30px 0 0; background: #fff; border-top: 4px solid var(--ink); border-bottom: 4px solid var(--ink); }
  .poll h2 { margin: 0 14px 22px; font-size: 16px; line-height: 1.35; text-transform: uppercase; letter-spacing: .14em;
             text-align: center; }
  .poll .row2 { display: grid; grid-template-columns: 1fr 1fr; }
  .poll button { aspect-ratio: 1 / 1; max-height: 340px; width: 100%; border: 0; cursor: pointer; color: #fff;
                 font-size: clamp(26px, 8vw, 42px); letter-spacing: .12em; text-transform: uppercase;
                 transition: transform .12s, opacity .3s, filter .3s; -webkit-tap-highlight-color: transparent; }
  .poll button.good { background: #77ff55; color: #0a3d00; }
  .poll button.bad { background: var(--red); }
  .poll button:active:not(:disabled) { transform: scale(.96); }
  .poll button:disabled { cursor: default; opacity: .25; filter: grayscale(1); }
  .poll button.chosen { opacity: 1; filter: none; }
  .poll button.chosen::after { content: " ✓"; }
  .poll .answer { margin: 0; padding: 16px 18px 18px; font-size: 16px; line-height: 1.45; text-align: center; min-height: 1.4em; }
  .poll .answer:empty { padding: 0; }
  .poll .catch { margin: 6px 0 0; color: var(--grey); }
  .related { margin-top: 34px; }
  .related h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--grey); margin: 0 0 4px; }
  .related .card { display: grid; grid-template-columns: 40% 1fr; gap: 12px; align-items: stretch; padding: 14px 0; }
  .related .card .thumb { margin: 0; border-width: 2px; aspect-ratio: auto; height: 100%; min-height: 90px; } /* as tall as the text next to it */
  .related .card h2 { font-size: 18px; line-height: 1.15; color: var(--ink); text-transform: none; margin: 0 0 6px; }
  .related .card .sub { font-size: 16px; }
  /* the three sources, at the bottom of every page */
  .sources { max-width: 680px; margin: 0 auto; padding: 18px 18px 40px; border-top: 1px solid var(--ink); font-size: 15px; line-height: 1.5; }
  .sources p { margin: 0 0 6px; color: var(--red); }
  .sources a { display: block; color: #000; word-break: break-all; }
  .end { margin-top: 30px; padding-top: 16px; border-top: 4px solid var(--ink); font-size: 15px; line-height: 1.5; }

  /* one entry, with the print button */
  .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: center; padding: 16px; }
  .sheet[hidden] { display: none; }
  .panel { background: #fff; width: 100%; max-width: 340px; margin: 0 auto; max-height: 86vh; overflow: auto;
           padding: 16px 16px 10px; border-radius: 14px; }
  .panel img, .panel .ph { width: 62%; margin: 0 auto; aspect-ratio: 1; object-fit: contain; background: #f2f2f2; display: block; }
  .panel h2 { margin: 12px 0 4px; font-size: 22px; font-weight: normal; letter-spacing: -.3px; }
  .panel .meta { font-size: 14px; margin-bottom: 6px; }
  .panel p { font-size: 14px; line-height: 1.4; margin: 0 0 12px; }
  .print { width: 100%; padding: 13px; border: 0; background: var(--ink); color: #fff; font-weight: normal; font-size: 16px; cursor: pointer; }
  .close { width: 100%; padding: 12px; border: 0; background: none; color: var(--grey); margin-top: 6px; cursor: pointer; }
  .printnote { font-size: 13px; color: var(--grey); text-align: center; min-height: 1.3em; margin-top: 8px; }
  .ph { display: grid; place-items: center; font-size: 40px; font-weight: normal; color: #bbb; }
</style>
</head>

<script src="shared.js"></script>
<script>
// ════════════════════════════════════════════════════════════════
//  RankFeed — a personal snapshot
//  The moment someone opens this page, it loads the ranking ONCE and writes three
//  articles for this visitor only (one per category). It never changes afterwards.
//  Reloading in the same browser tab keeps the same edition.
// ════════════════════════════════════════════════════════════════

// ── The three articles: no contestants on the thumbnail, only the category ──
//    word = the one word on the thumbnail, head = the plain headline (says what it is),
//    titles = the clickbait subheadline (one is picked at random). {n} = how many are ranked, {part} = part of the mix.
const TEASERS = {
  corporations: {
    word: "CAPITAL",
    head: "{n} of the World's Biggest Corporations, Ranked",
    titles: [
      "They Compete for Your Money Every Second. Now They Compete for a Spot on This List.",
      "We Ranked the Companies That Rank You. Number 1 Has Already Called a Lawyer.",
      "Forbes Ranks Them by Revenue. We Ranked Them by Something Much Worse.",
    ],
  },
  students: {
    word: "PEOPLE",
    head: "{n} VisCom Students, Ranked",
    titles: [
      "Your Classmates Have Been Ranked and Honestly, Some of You Should Sit Down",
      "Nobody Was Asked. Everybody Was Sorted. Find Out Where You Landed.",
      "You Spent Years Building a Portfolio. It Took Us Two Seconds to Rank You.",
    ],
  },
  things: {
    word: "THINGS",
    head: "{n} of the Greatest Things Ever, Ranked",
    titles: [
      "Sleep, Coffee or Oxygen? Only One Can Be Number 1.",
      "The Internet Picked the Greatest Things Ever. We Re-Ranked Them in Seconds.",
      "Everything Good in the World, Sorted From Best to Worst. Sorry, Last Place.",
    ],
  },
  mix: {
    word: "EVERYTHING",
    head: "People vs. Things vs. Capital, Ranked",
    titles: [
      "Is Your Classmate Worth More Than a Steam Engine? This List Has Decided.",
      "We Threw People, Things and Corporations Into One List. Nobody Is Safe.",
      "Everything Competes With Everything Now. Here's the Proof.",
    ],
  },
};

// ── Inside the article: the text next to each entry, BuzzFeed-list style ("A … so you can …").
//    HOOKS: one line per entry, keyed by the name the screens show. Corporations additionally get their
//    "Critical review:" from EXPOSED below. Entries without a hook (students) use LINES.
//    {N} the entry, {A} the one above, {B} the one below, {T} its tier, {R} its place, {n} how many.
const LINES = {
  // students: real names from the ZHdK VisCom class list, faces from thispersondoesnotexist.com
  students: {
    first: "{N}, a real VisCom student at ZHdK with a face that doesn't exist (thanks, thispersondoesnotexist.com), now officially at the very top.",
    last: "{N}, a real name from the VisCom class list, an AI-generated face, and the very last place.",
    mid: [
      "{N}, a real name from the ZHdK VisCom class list, wearing an AI-generated face from thispersondoesnotexist.com. Tier {T}.",
      "{N}, a VisCom student at ZHdK whose face was generated by thispersondoesnotexist.com, so nobody in this ranking has actually been seen. Tier {T}.",
      "{N}, a real VisCom student, a face that belongs to nobody, and a spot in tier {T}.",
    ],
  },
  // anything else without its own line in HOOKS
  other: { first: "{N}, right at the top, in tier {T}.", last: "{N}, at the very bottom, in tier {T}.", mid: ["{N}, landing in tier {T}."] },
};
const HOOKS = {
  // Corporations
  "Adobe": "Adobe, the company behind Photoshop, Illustrator and InDesign, so you can pay a monthly subscription for the tools your whole design class can't work without.",
  "Amazon": "Amazon, the everything store that started out selling books from a Seattle garage in 1994 and now also runs a huge share of the internet's servers with AWS.",
  "Apple": "Apple, the iPhone maker that takes up to 30% of App Store purchases, so almost every app you buy pays a little something to Cupertino.",
  "AstraZeneca": "AstraZeneca, the British-Swedish pharma giant behind the Oxford COVID vaccine and a long list of blockbuster drugs you've probably taken without knowing.",
  "Bayer": "Bayer, the German company that gave the world Aspirin and then, in 2018, bought Monsanto, the world's best-known seed and weedkiller company.",
  "BlackRock": "BlackRock, the world's largest asset manager, with more than $10 trillion under management and a stake in almost every big company on this list.",
  "Disney": "Disney, the entertainment giant that owns Marvel, Star Wars, Pixar and ESPN, so your entire childhood fits neatly into one streaming subscription.",
  "ExxonMobil": "ExxonMobil, the biggest US oil company, descended from John D. Rockefeller's Standard Oil, which was broken up for being a monopoly in 1911.",
  "H&M": "H&M, the Swedish fast-fashion chain with thousands of stores worldwide, so you can buy a new outfit for less than a pizza.",
  "Mastercard": "Mastercard, the card network that takes a small fee from almost every swipe, tap and click, so every coffee you buy pays them a little too.",
  "McDonald's": "McDonald's, the golden arches feeding tens of millions of people a day in more than 100 countries, plus one very famous burger.",
  "Mercedes-Benz": "Mercedes-Benz, the Stuttgart carmaker that traces itself back to Carl Benz's 1886 Motorwagen, the first real automobile, and has been selling luxury ever since.",
  "Meta": "Meta, the company formerly known as Facebook, which also owns Instagram and WhatsApp, so billions of people's chats and photos live under one roof.",
  "Nestlé": "Nestlé, the Swiss food giant from Vevey behind Nespresso, KitKat, Maggi and a long list of bottled waters.",
  "Netflix": "Netflix, which started out mailing DVDs in red envelopes and now streams to hundreds of millions of households, so you never have to leave the couch.",
  "Nike": "Nike, the sportswear giant whose swoosh was designed by a design student for $35 in 1971, so you can just do it in very expensive shoes.",
  "NVIDIA": "NVIDIA, the graphics-card maker that became one of the world's most valuable companies by selling the chips almost every AI runs on.",
  "Palantir": "Palantir, the data-analysis company co-founded by Peter Thiel and named after the all-seeing stones in The Lord of the Rings, so governments can see a little more.",
  "Philip Morris": "Philip Morris International, the company behind Marlboro, the world's best-selling cigarette brand, now promising a \"smoke-free future\" with IQOS heated tobacco.",
  "Rheinmetall": "Rheinmetall, Germany's largest arms maker, whose orders for tank ammunition have exploded since Russia's full-scale invasion of Ukraine in 2022.",
  "Shell": "Shell, the British oil major whose logo is an actual seashell, because the family business started out selling seashells in London.",
  "Spotify": "Spotify, the Swedish streaming app with more than 100 million songs, so you never have to buy an album again.",
  "Starbucks": "Starbucks, the Seattle coffee chain with more than 40,000 stores, so you're never more than a few blocks from a misspelled name on a cup.",
  "Uber": "Uber, the ride-hailing app that turned millions of private cars into taxis, so you can get anywhere without ever calling a dispatcher.",
  "UBS": "UBS, Switzerland's biggest bank and the world's largest wealth manager, which since 2023 has been the only Swiss big bank left.",
  // Things (listchallenges.com, "Top 100 Greatest Things Ever"), keyed by the file name with "_" as spaces
  "Happiness": "Happiness, which the World Happiness Report has been measuring country by country since 2012, with Finland on top year after year, so you know where to move.",
  "Adult Coloring Books": "Adult coloring books, which became a bestseller craze in 2015 thanks to Johanna Basford's \"Secret Garden\", so grown-ups can finally stay inside the lines in peace.",
  "Air Conditioner": "The air conditioner, invented by Willis Carrier in 1902 for a printing plant, so whole cities could grow in places that are way too hot.",
  "Animals": "Animals, about 8.7 million species by one famous 2011 estimate, most of them still undiscovered, so there's always another cute one to find.",
  "Body Wash": "Body wash, the liquid alternative to the soap bar that took over bathrooms in the 1990s, so you never have to deal with that slimy little soap leftover again.",
  "Bonzai Trees": "The bonsai, the Japanese art of keeping a tree tiny on purpose, which grew out of Chinese penjing, so you can own a forest that fits on your windowsill.",
  "Books": "Books, from Gutenberg's printed Bible in the 1450s to millions of new titles every year, so your \"to read\" pile can keep growing forever.",
  "Candy": "Candy, a word that goes back to the Arabic \"qandi\" for crystallised sugar, so every gummy bear comes with a little etymology.",
  "Chocolate": "Chocolate, drunk as a bitter, spicy drink in Mesoamerica for thousands of years before Europe added sugar, so your hot chocolate has a very long backstory.",
  "Clean Water": "Clean water, which around 2 billion people worldwide still don't have safely at home, according to the UN, so maybe don't let the tap run.",
  "Coffee": "Coffee, which legend says was discovered by an Ethiopian goat herder whose goats went wild after eating the berries, so you can survive another 8 a.m. class.",
  "Cozy Blankets": "Cozy blankets, the heart of \"hygge\", the Danish art of getting comfortable that took over the world around 2016, so you can stay on the couch and call it a lifestyle.",
  "Dentist": "The dentist, a job with a 9,000-year history (drilled teeth that old were found in Pakistan), so you can floss right before your appointment and pretend you always do.",
  "Deodorant": "Deodorant, first sold under the name \"Mum\" in 1888, so you can survive a summer tram ride with dignity.",
  "Electricity": "Electricity, tamed by Faraday, Edison, Tesla and many others in the 1800s, so you can read this on a glowing rectangle at 2 a.m.",
  "Exercise": "Exercise, which the WHO recommends for at least 150 minutes a week, so your step counter always has something to nag you about.",
  "Finding Money": "Finding money in your pocket, a tiny jackpot that's getting rarer now that most of us pay by card or phone, so enjoy that crumpled 10-franc note while it lasts.",
  "Firefighters": "Firefighters, organised as a public service as early as ancient Rome under Emperor Augustus (the \"vigiles\"), so someone always comes running when the toaster catches fire.",
  "Free Shipping": "Free shipping, the trick Amazon made standard with Prime in 2005, so the cost of delivery disappears into the price and the parcel van still comes to your door.",
  "Fireplaces": "Fireplaces, which moved the fire from the middle of the room to the wall once medieval homes got chimneys, so you can enjoy a fire without smoking out your living room.",
  "Flying Cars": "Flying cars, promised by every sci-fi movie since the 1950s and still mostly prototypes, so the future is always just five years away.",
  "Food": "Food, which humans have been cooking for hundreds of thousands of years, ever since we tamed fire, so you can have a snack and call it evolution.",
  "Getting Dream Job": "Your dream job, which these days often starts on LinkedIn, the network with more than a billion members, so you can update your profile one more time.",
  "Graduating College": "Graduating college, complete with throwing your square cap in the air, a tradition said to have started at the US Naval Academy in 1912.",
  "Having a Pet": "Having a pet, a habit that started at least 15,000 years ago when wolves turned into dogs, so someone is always happy to see you come home.",

  "Sunrise": "Sunrise, which is really just the Earth turning towards the sun, so you can set an alarm for 6 a.m. to watch a planet rotate.",
  "Sunsets": "Sunsets, red because the light travels through more air and the blue gets scattered away, so physics delivers a perfect Instagram story every evening.",
  "Swiss Cheese": "Swiss cheese, better known as Emmentaler, whose holes come from carbon dioxide bubbles and, as Swiss researchers found in 2015, tiny bits of hay in the milk.",
  "Tea": "Tea, the most popular drink in the world after water, which legend says began when a leaf fell into Chinese emperor Shen Nong's hot water around 2737 BC.",
  "Vaccines": "Vaccines, pioneered by Edward Jenner with cowpox in 1796, which went on to wipe smallpox off the planet by 1980.",
  "Writing": "Writing, invented in Mesopotamia around 3200 BC as cuneiform, mostly to keep track of grain and beer, so the first texts ever written were basically receipts.",
};
// where each list comes from, said in the intro ({source})
const SOURCES = {
  students: "the VisCom class list (faces by thispersondoesnotexist.com)",
  things: "a listchallenges.com list that promises \"There are the worst things that happen in the world, but there are also great things that can happen too!\"",
  corporations: "the Forbes Global 2000",
};
// the intro: one paragraph from each pool, picked at random. Pure BuzzFeed babble, no real content.
// ({n} how many, {label} the list, {source} where it comes from)
const INTROS_1 = [
  "Okay, we need to talk about this list. We've been staring at it for way too long, and honestly? Some of these placements are going to start fights in the group chat. 👀",
  "Grab a snack, get comfy, and maybe sit down, because this one gets intense. We ranked {n} {label} and we are NOT okay. 😳",
  "You asked, we delivered. Well, technically nobody asked. But here we are, and you're definitely going to want to see number 1. Trust us. 🔥",
  "Not to be dramatic, but this might be the most important list you read today. Maybe this week. Maybe ever. No pressure. ✨",
];

const $ = (id) => document.getElementById(id);
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffled = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
let edition = null;

// ════════ Write the edition (once) ════════
function writeEdition(snap) {
  const ORDER = ["corporations", "students", "things"]; // the order of the articles: capital, people, things
  const rank = (c) => (ORDER.indexOf(c.name) + 1) || 99;
  const mixed = snap.phase === "mix";
  // three articles (capital, people, things), or in the mix ONE article about the shared list
  const groups = mixed ? snap.categories.filter((c) => c.name === "mix")
                       : snap.categories.filter((c) => !c.virtual).sort((x, y) => rank(x) - rank(y));
  const articles = groups.map((c, i) => {
    const L = c;
    const key = mixed ? "mix" : c.name;
    const T = TEASERS[key] || TEASERS.mix;
    const entries = (L.entries || []).map((e) => ({ id: e.id, title: e.title, image: e.image, tier: e.tier, rank: e.rank }));
    const n = entries.length;
    entries.forEach((e, k) => {
      const G = e.image && e.image.includes("/students/") ? LINES.students : LINES.other;
      const generic = k === 0 ? G.first : k === n - 1 ? G.last : pick(G.mid);
      e.line = HOOKS[e.title] || fill(generic, { N: e.title, A: entries[k - 1]?.title, B: entries[k + 1]?.title, T: e.tier, R: e.rank, n });
      e.fact = EXPOSED[e.title] || null; // every Corporation gets its critical review
    });
    const source = mixed ? `${SOURCES.students}, ${SOURCES.things} and ${SOURCES.corporations}` : SOURCES[c.name] || "the internet";
    const v = { n, part: i + 1, source, label: mixed ? "people, things and capital" : c.label.toLowerCase(),
                top: entries[0]?.title, last: entries[n - 1]?.title };
    return {
      slug: mixed ? "everything" : c.name,
      list: c.name, // the list on the screens, for the verdict
      cat: mixed ? "Everything" : c.label,
      head: fill(T.head, v),
      title: fill(pick(T.titles), v),
      word: T.word,
      intros: [fill(pick(INTROS_1), v), fill(pick(INTROS_2), v)],
      middle: fill(pick(MIDDLES), v),
      vars: 9 + Math.floor(Math.random() * 30),
      ready: n >= 2,
      entries,
    };
  });
  return { at: Date.now(), mixed, articles };
}

// ════════ Pieces ════════
const timeOf = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }); // always 24h, e.g. 13:39
const img = (e, cls = "") => e.image
  ? `<img class="${cls}" src="${esc(e.image)}" alt="${esc(e.title)}" loading="lazy">`
  : `<div class="ph ${cls}">${esc(e.title[0])}</div>`;
const tierChip = (t) => `<span class="tier" data-t="${t}" style="--c:var(--tier-${t})">${t}</span>`;
const thumb = (a) => `<div class="thumb"><span>${esc(a.word)}</span></div>`;
const teaser = (a, cls = "card") => `
  <a class="${cls}" href="#/${a.slug}">
    ${thumb(a)}
    <div>
      <h2>${esc(a.head)}</h2><p class="sub">${esc(a.title)}</p></div>
  </a>`;
// one entry: place, name as its headline, picture, the one-liner, and (Corporations) the critical review.
// big = the top 3 (picture full width), otherwise a compact row (number, small picture, text)
const review = (e) => e.fact ? `
    <p class="review"><span class="lbl">Critical review:</span> ${esc(e.fact.text)}
      <a class="src" href="${esc(e.fact.url)}" target="_blank" rel="noopener">Source: ${esc(e.fact.src)}</a></p>` : "";
// one entry: the name, the picture, the one-liner and (corporations) the critical review. No numbers.
const entry = (e) => `
  <li class="entry" data-id="${esc(e.id)}">
    <h3>${esc(e.title)}</h3>
    ${img(e)}
    <p class="hook">${esc(e.line)}</p>
    ${review(e)}
  </li>`;
// the entries grouped by tier, each group under a big colored "A-TIER" block
const TIER_ORDER = ["S", "A", "B", "C", "D", "F"];
const tierBlock = (t) => `<div class="tierhead" data-t="${t}" style="--c:var(--tier-${t})"><span>${t}-TIER</span></div>`;
const byTier = (entries) => TIER_ORDER.map((t) => [t, entries.filter((e) => e.tier === t)]).filter(([, l]) => l.length);

// ════════ Views ════════
function home() {
  delete $("view").dataset.slug;
  const ready = edition.articles.filter((a) => a.ready);
  $("view").innerHTML = `
    ${ready.map((a) => teaser(a)).join("")}
    ${ready.length ? "" : `<p class="note">Still ranking. Come back in a minute for your edition.</p>`}`;
  window.scrollTo(0, 0);
}

function article(slug) {
  const a = edition.articles.find((x) => x.slug === slug);
  if (!a || !a.ready) return home();
  $("view").dataset.slug = slug;
  const groups = byTier(a.entries);
  const others = edition.articles.filter((x) => x.slug !== slug && x.ready);
  $("view").innerHTML = `
    <div class="article">
      <a class="back" href="#">← All articles</a>
      <h1>${esc(a.head)}</h1>
      <p class="deck">${esc(a.title)}</p>
      <div class="body">
        ${a.intros.map((p) => `<p>${esc(p)}</p>`).join("")}
        ${groups.map(([t, list], gi) => `
          ${gi === 1 ? `<p>${esc(a.middle)}</p>` : ""}
          ${tierBlock(t)}
          <ol class="entries">${list.map(entry).join("")}</ol>`).join("")}
        <div class="poll"><h2>${esc(VERDICT.title)}<br>${esc(VERDICT.question)}</h2>
          <div class="row2"><button type="button" class="good" data-vote="good">${esc(VERDICT.good)}</button>
          <button type="button" class="bad" data-vote="bad">${esc(VERDICT.bad)}</button></div>
          <p class="answer" id="answer"></p>
        </div>
        ${others.length ? `<div class="related"><h2>You might also be ranked in</h2>${others.map((o) => teaser(o, "card")).join("")}</div>` : ""}
        <p class="end">${esc(END)}</p>
      </div>
    </div>`;
  document.querySelectorAll(".entry").forEach((el) => (el.onclick = (ev) => { if (!ev.target.closest("a")) location.hash = `#/${slug}/${encodeURIComponent(el.dataset.id)}`; }));
  setupVerdict(a);
  window.scrollTo(0, 0);
}

function sheet(slug, id) {
  const a = edition.articles.find((x) => x.slug === slug);
  const e = a && a.entries.find((x) => x.id === id);
  if (!e) return;
  $("panel").innerHTML = `
    ${img(e)}
    <h2>${esc(e.title)}</h2>
    <div class="meta">${tierChip(e.tier)}${esc(a.cat)}</div>
    <button class="print" id="print">Print</button>
    <div class="printnote" id="printnote"></div>
    <button class="close" id="close">Close</button>`;
  $("sheet").hidden = false;
  $("print").onclick = () => printEntry(e, a);
  $("close").onclick = () => history.back();
}

// ════════ The verdict: one vote per article, sent to the brain ════════
function setupVerdict(a) {
  const key = `rankfeed-voted-${edition.at}-${a.slug}`;
  const buttons = document.querySelectorAll(".poll [data-vote]");
  const done = (vote) => {
    buttons.forEach((b) => { b.disabled = true; b.classList.toggle("chosen", b.dataset.vote === vote); });
    $("answer").innerHTML = `${esc(vote === "good" ? VERDICT.thanksGood : VERDICT.thanksBad)}<p class="catch">${esc(VERDICT.catch)}</p>`;
  };
  let already = null;
  try { already = localStorage.getItem(key); } catch {}
  if (already) return done(already);
  buttons.forEach((b) => (b.onclick = async () => {
    const vote = b.dataset.vote;
    buttons.forEach((x) => (x.disabled = true));
    try {
      const r = await fetch(RANK_BASE + "/api/vote", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ list: a.list, vote, order: a.entries.map((e) => e.image) }), // the voter's list, best first
      });
      if (r.status === 429) { $("answer").textContent = VERDICT.tooFast; buttons.forEach((x) => (x.disabled = false)); return; }
      if (!r.ok) throw new Error();
      try { localStorage.setItem(key, vote); } catch {}
      done(vote);
    } catch {
      $("answer").textContent = VERDICT.offline;
      buttons.forEach((x) => (x.disabled = false));
    }
  }));
}

// ════════ PRINT ════════
// Called when a visitor presses "Print" on an entry.
//   entry   = { id, title, image, tier, rank, line }
//   article = { slug, list, cat, title, entries }   (slug = corporations | students | things, or everything in the mix)
// Sends a print job to the brain; the print station (print-station.html) prints it on the printer in the room.
// The print shows the entry as this edition shows it: its place here, and its path only up to this edition.
// (print.html?list=…&image=… still shows the print on the screen, with the normal print dialog.)
async function printEntry(entry, article) {
  const note = $("printnote"), button = $("print");
  button.disabled = true;
  note.textContent = "Sending…";
  try {
    const at = edition.at + (serverNow() - Date.now()); // when this edition was written, on the server's clock
    const r = await fetch(RANK_BASE + "/api/print", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ list: article.list, image: entry.image, at, rank: entry.rank, tier: entry.tier, of: article.entries.length }),
    });
    // stickers are printed 12 to a sheet: say how many are still missing until this one is printed
    const m = r.ok ? await r.json().catch(() => ({})) : {};
    const missing = m.waiting ? (12 - (m.waiting % 12)) % 12 : null;
    note.textContent = r.ok
      ? missing === 0 ? "Your sticker is on a full sheet. It is printing now."
        : missing ? `Your sticker is in the queue. It prints when the sheet of 12 is full (${missing} more to go).`
        : "Your sticker is in the queue."
      : r.status === 429 ? "One print at a time. Try again in a few seconds."
      : r.status === 404 ? "This one can't be printed yet."
      : "The printer is busy. Try again in a moment.";
  } catch {
    note.textContent = VERDICT.offline;
  }
  setTimeout(() => (button.disabled = false), 5000);
}

// ════════ Routing: #/students and #/students/<entry id> ════════
function route() {
  if (!edition) return;
  const [, slug, id] = location.hash.split("/");
  if (!slug) { $("sheet").hidden = true; return home(); }
  if ($("view").dataset.slug !== slug) article(slug);
  if (id) sheet(slug, decodeURIComponent(id));
  else $("sheet").hidden = true;
}
window.addEventListener("hashchange", route);
$("sheet").addEventListener("click", (ev) => { if (ev.target === $("sheet")) history.back(); });

// ════════ Start: load once, write once ════════
(async function start() {
  // every page load (also a manual refresh) writes a new edition from the ranking at that moment
  try {
    edition = writeEdition(await fetchRankState());
    $("asof").innerHTML = `Rankings from<br>${timeOf(edition.at)}`;
    // in the mix there is only one article: C, P and T all lead to it
    if (edition.mixed) document.querySelectorAll(".badges .bdg").forEach((b) => (b.href = "#/everything"));
  } catch {
    $("view").innerHTML = `<p class="edition">Offline</p><p class="note">The ranking can't be reached right now. Try again in a moment.</p>`;
    return;
  }
  route();
})();
</script>
</body>
